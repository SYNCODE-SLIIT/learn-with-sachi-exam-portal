<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Kuppi Portal</title>
<style>
:root{
  --bg:#000; --side:#0a0a0a; --surf:#111; --surf2:#181818; --line:#2a2a2a; --line2:#3c3c3c;
  --txt:#f4f4f4; --muted:#a6a6a6; --faint:#747474;
  --y:#ffd400; --y2:#b89600; --y3:#6f5b00; --ytext:#000;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI","Nirmala UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
::selection{background:var(--y);color:#000}
.view{display:none}
.view.on{display:block;animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ================= landing */
.land{max-width:1100px;margin:0 auto;padding:0 24px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.land h1{font-size:clamp(42px,7.4vw,88px);line-height:1;font-weight:800;letter-spacing:-2.5px;text-align:center}
.land h1 span{color:var(--y)}
.rule{width:84px;height:5px;background:var(--y);margin:26px auto 0}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:60px}
@media(max-width:760px){.mods{grid-template-columns:1fr}}
.mcard{position:relative;display:flex;flex-direction:column;padding:34px 34px 30px;background:var(--surf);border:1px solid var(--line);min-height:330px;transition:border-color .25s,transform .25s,background .25s}
.mcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--y)}
.mcard:hover{border-color:var(--y);transform:translateY(-6px);background:var(--surf2)}
.mcard .code{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--y)}
.mcard h2{font-size:clamp(26px,3vw,34px);line-height:1.12;margin:10px 0 10px;font-weight:700}
.mcard p{color:var(--muted);font-size:15px;max-width:380px}
.mstats{display:flex;gap:30px;margin-top:auto;padding-top:30px}
.mstats b{display:block;font-size:36px;line-height:1;font-weight:800;color:var(--txt)}
.mstats span{font-size:12px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.mopen{display:inline-flex;align-items:center;gap:10px;margin-top:26px;font-weight:700;color:var(--y);font-size:15px;letter-spacing:.3px}
.mopen svg{transition:transform .25s}.mcard:hover .mopen svg{transform:translateX(7px)}
.lfoot{margin:54px 0 18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.lbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 22px;border:1px solid var(--line2);background:transparent;font-size:14px;font-weight:600;color:var(--txt);transition:.2s}
.lbtn.cares{border-color:var(--y);background:var(--y);color:#000;font-weight:800}
.lbtn.cares:hover{background:#ffe033;border-color:#ffe033;color:#000;transform:translateY(-2px)}
.syncfoot{margin:0 0 38px;text-align:center;font-size:13px;color:var(--muted);letter-spacing:.3px}
.syncfoot a,.syncfoot button{color:var(--txt);font-weight:700;border-bottom:1px solid var(--y);padding-bottom:1px;transition:.2s}
.syncfoot a:hover,.syncfoot button:hover{color:var(--y)}
.cmod{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.cmod.on{display:flex;animation:fin .22s ease}
.cbox{position:relative;width:100%;max-width:720px;background:var(--side);border:1px solid var(--line2);border-top:5px solid var(--y);padding:34px 34px 26px;margin:auto;box-shadow:0 24px 64px rgba(0,0,0,.85)}
.cclose{position:absolute;top:18px;right:18px;width:36px;height:36px;border:1px solid var(--line2);color:var(--muted);display:grid;place-items:center;transition:.18s;font-size:18px;line-height:1}
.cclose:hover{border-color:var(--y);color:var(--y)}
.cbox h2{font-size:clamp(24px,3.6vw,34px);line-height:1.12;font-weight:800;letter-spacing:-.8px;margin:6px 0 14px}
.cbox h2 span{color:var(--y)}
.cmiss{color:var(--txt);font-size:14.5px;line-height:1.6;padding:14px 18px;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--y);margin-bottom:22px}
.cmiss b{display:block;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--y);margin-bottom:5px}
.csub{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--y);margin-bottom:12px}
.csub span{font-weight:500;letter-spacing:.3px;text-transform:none;color:var(--muted);font-size:12.5px}
.clist{display:grid;grid-template-columns:1fr;gap:10px}
.citem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;background:var(--surf);border:1px solid var(--line);text-align:left;transition:.2s}
.citem:hover{border-color:var(--y);background:var(--surf2);transform:translateY(-2px)}
.citem b{display:block;font-size:14px;font-weight:700;color:var(--txt);line-height:1.3}
.citem small{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.citem .wa-ic{flex:none;width:32px;height:32px;background:var(--y);color:#000;display:grid;place-items:center;transition:transform .2s}
.citem:hover .wa-ic{transform:translateX(3px)}
.cfoot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cfoot a{color:var(--y);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.cfoot a:hover{text-decoration:underline}
.lbtn:hover{border-color:var(--y);color:var(--y)}


.kick{display:none}
@media(max-width:700px){
  .land{padding:44px 18px 34px;justify-content:flex-start}
  .kick{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--y);margin-bottom:18px}
  .kick::before{content:"";width:26px;height:2px;background:var(--y)}
  .land h1{text-align:left;font-size:min(13.4vw,64px);line-height:1;letter-spacing:-1.5px}
  .land h1 span{display:block}
  .rule{margin:22px 0 0;width:64px;height:5px}
  .mods{gap:16px;margin-top:32px}
  .mcard{padding:24px 20px 0;min-height:0;overflow:hidden}
  .mcard h2{font-size:26px;margin:8px 0 8px}
  .mcard p{font-size:14px}
  .mstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin:22px -20px 0;padding:0;border-top:1px solid var(--line)}
  .mstats div{padding:14px 0 13px 20px;border-right:1px solid var(--line)}
  .mstats div:last-child{border-right:0}
  .mstats b{font-size:28px}
  .mstats div:first-child b{color:var(--y)}
  .mstats span{font-size:10.5px;letter-spacing:.6px}
  .mopen{margin:0 -20px;padding:16px 20px;background:var(--y);color:#000;justify-content:space-between;font-size:15px;letter-spacing:.4px}
  .mcard:active{background:var(--surf2)}
  .mcard:hover{transform:none}
  .lfoot{flex-direction:column;gap:10px;margin:26px 0 0}
  .lbtn{width:100%;text-align:center;padding:15px 18px}
  .syncfoot{margin:14px 0 10px}
  .cbox{padding:26px 20px 22px}
  .clist{grid-template-columns:1fr}
}

/* ================= module shell */
.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 18px 18px}
.side::-webkit-scrollbar{display:none;width:0;height:0}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;font-weight:600;transition:.2s;align-self:flex-start}
.back:hover{color:var(--y)}
.sh{margin:22px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.sh .code{font-size:12px;font-weight:700;letter-spacing:2.6px;color:var(--y)}
.sh h2{font-size:20px;line-height:1.2;font-weight:700;margin:5px 0 12px}
.cd{display:flex;gap:8px}
.cd div{flex:1;border:1px solid var(--line);padding:8px 10px}
.cd b{display:block;font-size:20px;line-height:1.1;color:var(--y);font-weight:800}
.cd span{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.ng{font-size:11px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--faint);margin:6px 0 8px 2px}
.navlist{display:flex;flex-direction:column;gap:3px;margin-bottom:16px}
.ni{display:flex;align-items:center;gap:11px;padding:10px 12px;border-left:3px solid transparent;text-align:left;width:100%;font-size:14px;font-weight:500;color:var(--muted);transition:.18s;position:relative}
.ni:hover{background:var(--surf);color:var(--txt)}
.ni.on{background:var(--surf2);border-left-color:var(--y);color:var(--txt);font-weight:700}
.ni .no{flex:none;min-width:30px;font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--y)}
.ni .nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .cv{flex:none;font-size:11.5px;color:var(--faint)}
.ni.full .cv{color:var(--y)}
.ni .dot{flex:none;width:8px;height:8px;background:var(--y)}
.ni .dot.o{background:transparent;border:1.5px solid var(--faint)}
.sp{flex:1}
.prog{border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--muted)}
.prog .tr{height:6px;background:var(--surf2);margin-top:8px}
.prog .fl{height:100%;width:0;background:var(--y);transition:width .4s}
.prog b{color:var(--txt)}
.sfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sfoot a{font-size:12px;font-weight:600;color:var(--faint);border-bottom:1px solid var(--line2);padding-bottom:1px}
.sfoot a:hover{color:var(--y);border-color:var(--y)}

.main{padding:44px 54px 70px;min-width:0}
.main .inner{max-width:1240px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--y)}
.main h1{font-size:clamp(28px,4vw,44px);line-height:1.1;font-weight:800;letter-spacing:-1px;margin:6px 0 8px}
.lede{color:var(--muted);font-size:15px;max-width:640px}
.ysep{width:56px;height:4px;background:var(--y);margin:20px 0 26px}

/* exam map */
.bars{display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:190px 1fr 124px;gap:16px;align-items:center;padding:13px 12px;margin:0 -12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.bar:hover{background:var(--surf)}
.bar .nm{font-size:14.5px;font-weight:600}
.bar .nm i{font-style:normal;color:var(--y);font-weight:800;margin-right:10px}
.bar .tr{height:12px;background:var(--surf2);border:1px solid var(--line)}
.bar .fl{height:100%;width:var(--w,0%);background:var(--y);animation:grow 1s cubic-bezier(.2,.8,.2,1) .15s both}
.bar.p-mid .fl{background:var(--y2)}.bar.p-low .fl{background:var(--y3)}.bar.p-skip .fl{background:#3a3a3a}
@keyframes grow{from{width:0}}
.bar .vl{text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}
.legend{display:flex;gap:22px;margin-top:18px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px}


/* exam map charts */
.inner.wide{max-width:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{border:1px solid var(--line);background:var(--surf);padding:18px 18px 16px;border-top:3px solid var(--y)}
.kpi b{display:block;font-size:34px;line-height:1;font-weight:800;color:var(--y);letter-spacing:-1px}
.kpi b small{font-size:17px;color:var(--muted);font-weight:700;margin-left:2px}
.kpi span{display:block;margin-top:8px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;margin-bottom:20px}
@media(min-width:901px){.mgrid.eq{grid-template-columns:1fr 1fr}}
.pc{border:1px solid var(--line);background:var(--surf);padding:22px}
.pc h4{font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--y)}
.pc .ps{font-size:13px;color:var(--muted);margin:4px 0 16px}
.dwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut{width:210px;height:210px;flex:none}
.donut .seg{cursor:pointer;transition:opacity .2s;animation:dr 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes dr{from{stroke-dasharray:0 var(--c)}}
.donut text{text-anchor:middle}
.dl{flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px}
.dl div{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 -8px;font-size:13.5px;cursor:pointer;transition:background .15s}
.dl div:hover{background:var(--surf2)}
.dl i{flex:none;width:12px;height:12px}
.dl em{font-style:normal;flex:1}
.dl b{font-weight:700;color:var(--txt)}
.heat{display:grid;grid-template-columns:150px repeat(var(--cols),1fr) 48px;gap:5px;align-items:center}
.heat .hh{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-align:center;text-transform:uppercase}
.heat .hl{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.heat .hl i{font-style:normal;color:var(--y);font-weight:800;margin-right:8px}
.heat .hc{height:30px;border:1px solid var(--line);background:var(--surf2);cursor:pointer}
.heat .hc.on{background:var(--y);border-color:var(--y)}
.heat .ht{font-size:12px;color:var(--muted);text-align:right}
.heat .hl:hover{color:var(--y)}
.stack{display:flex;height:34px;border:1px solid var(--line);overflow:hidden}
.stack div{display:grid;place-items:center;font-size:12px;font-weight:800;color:#000;min-width:0}
.sleg{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.sleg i{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px}
.hy{display:flex;flex-direction:column;gap:2px}
.hy>div{display:grid;grid-template-columns:128px 1fr 56px;gap:14px;align-items:center;padding:8px 8px;margin:0 -8px;cursor:pointer;font-size:13.5px;transition:background .15s}
.hy>div:hover{background:var(--surf2)}
.hy .tk{display:flex;gap:3px}
.hy .tk i{flex:1;height:14px;background:var(--surf2);border:1px solid var(--line)}
.hy .tk i.on{background:var(--y);border-color:var(--y)}
.hy .nm i{font-style:normal;color:var(--y);font-weight:800;margin-right:8px}
.hy .vl{text-align:right;color:var(--muted);font-size:12.5px}
@media(max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .mgrid{grid-template-columns:1fr}
  .heat{grid-template-columns:104px repeat(var(--cols),1fr) 40px}
  .hy>div{grid-template-columns:96px 1fr 48px;gap:10px}
  .donut{margin:0 auto}
}

/* rules */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
.stats div{border:1px solid var(--line);background:var(--surf);padding:18px 14px;text-align:center;border-top:3px solid var(--y)}
.stats b{display:block;font-size:24px;line-height:1.15;color:var(--y);font-weight:800}
.stats span{font-size:12px;color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:0;counter-reset:r}
.rules div{display:flex;gap:18px;align-items:flex-start;padding:17px 4px;border-bottom:1px solid var(--line);font-size:16px}
.rules i{counter-increment:r;flex:none;width:32px;height:32px;background:var(--y);color:#000;font-style:normal;font-weight:800;font-size:14px;display:grid;place-items:center}
.rules i::before{content:counter(r)}

/* lecture view */
.lhead{display:flex;gap:18px;align-items:flex-start}
.lbig{flex:none;width:64px;height:64px;background:var(--y);color:#000;display:grid;place-items:center;font-weight:800;font-size:22px}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.tg{font-size:11.5px;font-weight:700;padding:3px 10px;letter-spacing:.3px;border:1px solid var(--line2);color:var(--muted)}
.tg.hot{background:var(--y);border-color:var(--y);color:#000}
.tg.mid{border-color:var(--y2);color:var(--y2)}
.tg.low{border-color:var(--y3);color:#9b8400}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 18px}
.tbtn{padding:9px 16px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--muted);transition:.18s}
.tbtn:hover{border-color:var(--y);color:var(--y)}
.tbtn.on{background:var(--y);border-color:var(--y);color:#000}

/* tree */
.rootrow{display:flex;align-items:center;gap:14px;padding:13px 18px;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--y)}
.rootrow b{font-size:16.5px}.rootrow .cnt{margin-left:auto;color:var(--muted);font-size:13px}
.rootrow.sm{padding:10px 16px;margin-top:14px}.rootrow.sm b{font-size:15px}
.children{margin-left:26px;padding:6px 0 4px 26px}
.children>.node{position:relative}
.children>.node::before{content:"";position:absolute;left:-26px;top:-6px;bottom:0;border-left:1.5px solid var(--line2)}
.children>.node:last-child::before{bottom:auto;height:calc(var(--tick) + 6px)}
.children>.node::after{content:"";position:absolute;left:-26px;top:var(--tick);width:20px;border-top:1.5px solid var(--line2)}
.lv2{--tick:26px}.lv3{--tick:15px}
.kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.node.open>.kids{grid-template-rows:1fr}
.kin{overflow:hidden}
.nrow{width:100%;text-align:left;display:flex;gap:13px;align-items:center}
.topic>.nrow{padding:10px 12px;margin:3px 0;border:1px solid transparent;transition:.15s}
.topic>.nrow:hover{background:var(--surf);border-color:var(--line)}
.topic.open>.nrow{background:var(--surf);border-color:var(--line2)}
.ck{flex:none;width:22px;height:22px;border:1.5px solid var(--faint);display:grid;place-items:center;color:transparent;transition:.15s}
.ck:hover{border-color:var(--y)}
.topic.done .ck{background:var(--y);border-color:var(--y);color:#000}
.ttx{flex:1;min-width:0;font-weight:600;font-size:15px}
.ttx small{display:block;font-weight:400;font-size:12px;color:var(--faint)}
.topic.done .ttx{color:var(--muted)}
.yield{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;background:var(--y);color:#000;padding:1px 8px;margin-right:8px;vertical-align:1px}
.chev{flex:none;width:28px;height:28px;display:grid;place-items:center;color:var(--muted);transition:transform .25s}
.node.open>.nrow .chev{transform:rotate(90deg);color:var(--y)}
.leaf{padding:5px 0 5px 4px;font-size:14.5px;position:relative}
.leaf b{color:var(--y)}
.leaf table{width:100%;border-collapse:collapse;font-size:13.5px;margin:2px 0}
.leaf td,.leaf th{border:1px solid var(--line2);padding:7px 11px;text-align:left;vertical-align:top}
.leaf th{background:var(--y);color:#000;font-weight:700}
.leaf.note .lf{border-left:3px solid var(--y);background:var(--surf);padding:8px 14px;font-size:13.5px}
.leaf.note .lf::before{content:"NOTE  ";font-weight:800;color:var(--y);letter-spacing:.8px;font-size:11px}
.etip{margin:14px 0 6px;padding:16px 20px;background:var(--y);color:#000;font-size:14.5px;font-weight:500}
.etip b{letter-spacing:1px;text-transform:uppercase;font-size:11.5px;margin-right:10px;background:#000;color:var(--y);padding:2px 8px}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.lnav button{padding:11px 20px;border:1px solid var(--line2);font-size:13.5px;font-weight:600;color:var(--txt);transition:.18s}
.lnav button:hover:not(:disabled){border-color:var(--y);color:var(--y)}
.lnav button:disabled{opacity:.3;cursor:default}
.hide{display:none!important}
.empty{color:var(--muted);padding:30px 0}


/* head row, papers and preview */
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:6px 18px;flex-wrap:wrap}

 {n:4,t:"Design for Different Interactions",p:"mid",w:9.5,wl:"≈ 6 / 13 marks",s:"Ideation · 5 dimensions · IA · Interaction types",tags:["2019","2022","2023","2024"],
  topics:[
   {t:"Ideation rules & techniques",h:1,sub:"every paper",b:li(["<b>Golden rules:</b> no bad ideas · capture everything · hybrid (individual → group) · quantity over quality.","<b>Mind map · Worst possible idea · SCAMPER</b> (Substitute, Combine, Adapt, Modify, Put to another use, Eliminate, Reverse)."])},
   {t:"Brainstorm vs Brainwrite",h:1,sub:"2023 Q2(d)",b:'<table><tr><th></th><th>Brainstorm</th><th>Brainwrite</th></tr><tr><td>Mode</td><td>Verbal, free-flow, 6–10 people</td><td>Silent, written; 3 ideas × 3 min; pass papers</td></tr><tr><td>Participation</td><td>Loud members dominate / blocking</td><td>Equal opportunity, anonymous</td></tr></table>'},
   {t:"Interaction design – 5 dimensions",sub:"2024 Q4(a)",b:li(["<b>1D</b> Words · <b>2D</b> Visual · <b>3D</b> Physical objects/space · <b>4D</b> Time · <b>5D</b> Behaviour."])},
   {t:"Interaction types",h:1,sub:"2019 · 2022 · 2024",b:li(["<b>Instructing</b> (commands) · <b>Conversing</b> (talk) · <b>Manipulating</b> (drag, zoom – direct manipulation) · <b>Exploring</b> (move through environments).","Interaction type = what user does · Interface type = the UI (touch, speech…)."])},

   {t:"Functional vs Non-functional †",sub:"2024 Q3(b) – not in slides",b:li(["<b>Functional</b> = what the system does (schedule, search, book).","<b>Non-functional</b> = how well (performance, security, usability, accessibility)."])}

 {n:5,t:"Design Recommendations",p:"mid",w:3.5,wl:"≈ 3 / 4 marks",s:"Principles · Standards · Best practices · Usability process",tags:["2022","2023","2024"],
  topics:[
   {t:"Design principles (6)",h:1,sub:"2022 · 2024",b:li(["<b>Visibility</b> – core functions prominent · <b>Feedback</b> – immediate, specific, in context","<b>Constraints</b> – physical, logical, cultural · <b>Affordance</b> – looks usable (perceived)","<b>Mapping</b> – controls ↔ effects · <b>Consistency</b> – aesthetic, functional, internal, external"])},
   {t:"Best practices (pick 3)",sub:"2023 Q3(d)",b:li(["Colour palette · colour-blind awareness · typefaces · font pairing (max 2) · images · grid · visual hierarchy · white space."])},

  ],tip:"Image-based UI ප්‍රශ්න (ADAS) වලට principles 4 apply කරන්න."},
 {n:6,t:"UX Engineering – Prototyping",p:"hot",w:13,wl:"≈ 15 / 11 marks",s:"Prototype · Fidelity · Low-fi · Hi-fi",tags:["2019","2022","2023","2024"],
  topics:[
   {t:"Why prototype?",h:1,b:li(["Test the <b>flow</b> & get feedback before building: <b>Visualization</b> + <b>Feedback</b> → saves time & money.","“Prototype not needed” → <b>Disagree</b>."])},
   {t:"Low vs High fidelity",h:1,sub:"2022 Q2(b)",b:'<table><tr><th></th><th>Low-fi</th><th>Hi-fi</th></tr><tr><td>Content</td><td>Rough / placeholder</td><td>Realistic</td></tr><tr><td>Interaction</td><td>Little / none</td><td>Clickable, animated</td></tr><tr><td>Aesthetics</td><td>Hand-drawn</td><td>Final look</td></tr><tr><td>Use</td><td>Early, cheap, fast</td><td>Testing, sign-off</td></tr></table>'},
   {t:"Low-fi techniques",b:li(["Sketches · paper prototypes · storyboards · Wizard-of-Oz · index cards · wireframes."])},
   {t:"Hi-fi techniques",h:1,sub:"2019 · 2023 · 2024",b:li(["<b>Click-through</b> · <b>interactive</b> · <b>digital</b> · <b>coded (HTML/CSS)</b> — closest to final, best for user feedback."])},
   {t:"Which prototype for management?",h:1,sub:"2023 · 2024",b:li(["<b>High-fidelity</b> — management can experience interactions & overall structure.","Examples: click-through (Figma / XD) · coded / interactive prototype."])+tip("Horizontal = many features, shallow · Vertical = few features, deep.")}
  ],tip:"Lo-fi vs Hi-fi + 'which one for…' ප්‍රශ්නය හැම අවුරුද්දෙම."},
 {n:7,t:"Usability Evaluation",p:"hot",w:12.5,wl:"≈ 15 / 10 marks",s:"Formative / Summative · Heuristics · Think-aloud · User testing",tags:["2022","2023","2024"],
  topics:[
   {t:"Usability & 5 dimensions",sub:"2023 Q4(a)",b:li(["ISO 9241-11: specified users, goals, effectiveness, efficiency, satisfaction, context.","<b>Learnability · Efficiency · Memorability · Errors · Satisfaction.</b>"])},
   {t:"Formative vs Summative",h:1,sub:"2022 · 2023 · 2024",b:li(["<b>Formative</b> – during design, iterative, <b>qualitative</b>.","<b>Summative</b> – after completion / before redesign, compare products, <b>quantitative</b>."])},
   {t:"Heuristic evaluation (Nielsen's 10)",h:1,sub:"2022 · 2023 · 2024",b:li(["3–5 experts inspect UI against heuristics: inspect → compare → list problems & justify.","Status visibility · real-world match · user control · consistency · error prevention · recognition > recall · flexibility · minimalism · error recovery · help & documentation."])},
   {t:"Think-aloud",h:1,sub:"2022 · 2023 · 2024",b:li(["Users <b>verbalise thoughts</b> while doing tasks → reveals <b>why</b> (Nielsen: most valuable method).","Neutral prompts (“What are you thinking?”); avoid leading questions. – unnatural, affects timing."])},
   {t:"Cognitive walkthrough & user testing",b:li(["Walkthrough: prototype + tasks + action sequence → 5 questions per step → report.","Roles: <b>User · Observer · Moderator</b>. Pilot first."])},
   {t:"Ethics, measures, reliability & validity",b:li(["Informed consent, withdraw anytime, confidentiality, test the system not the user.","Measures: time, errors, success ratio, help use…"])}

 {n:4,t:"Accounting & Finance",p:"hot",w:100,wl:"4 / 4 papers",s:"Accounting equation · Ratios · Sources of finance · Target costing",tags:["2019","2022","2023","2024"],
  topics:[
   {t:"Elements: Asset, Liability, Capital, Income, Expense",b:li(["<b>Asset</b> – controlled resource, future benefits · <b>Liability</b> – present obligation · <b>Capital = Assets − Liabilities</b>.","<b>Fixed assets</b> – long-term, for use (land, machinery) · <b>Current assets</b> – within 12 months (stock, debtors, cash)."])},
   {t:"Accounting equation – A = L + C",h:1,sub:"every paper · up to 30 marks",b:li(["Every transaction affects ≥ 2 items → equation always tallies.","Invest cash: Cash ↑ Capital ↑ · Buy on credit: Asset ↑ Creditors ↑ · Pay creditor: Cash ↓ Creditors ↓ · Expense: Cash ↓ Capital ↓ · Drawings: Cash ↓ Capital ↓ · Loan: Cash ↑ Loan ↑ · Sale at profit: Cash/Debtors ↑ Inventory ↓ Capital ↑."])+tip("Make a table, tick the total, and verify Assets = Liabilities + Capital at the end.")},
   {t:"Ratios – formulas",h:1,sub:"every paper",b:'<table><tr><th>Ratio</th><th>Formula</th></tr><tr><td>Gross profit rate</td><td>GP ÷ Revenue × 100</td></tr><tr><td>Net profit rate</td><td>NP ÷ Revenue × 100</td></tr><tr><td>Current ratio</td><td>CA ÷ CL (2.0)</td></tr><tr><td>Quick ratio</td><td>(CA − Inventory) ÷ CL (1.0)</td></tr><tr><td>Receivable days</td><td>Receivables × 365 ÷ Revenue</td></tr><tr><td>Gearing</td><td>Debt ÷ Equity × 100</td></tr><tr><td>† Inventory turnover</td><td>COGS ÷ Inventory</td></tr><tr><td>† Total assets turnover</td><td>Revenue ÷ Total assets</td></tr></table>'},
   {t:"Interpreting ratios",h:1,b:li(["Template: “[Ratio] increased/decreased from X to Y → means … → good/bad because … → suggestion.”","Higher profit rates = better · higher liquidity = safer · lower receivable days = better · higher gearing = higher risk."])},
   {t:"Sources of finance",sub:"2024 Q4(b)",b:li(["<b>Internal:</b> own capital, savings, sale of assets, retained profit.","<b>External:</b> debentures, overdraft, <b>hire purchase</b>, bank loans."])},
   {t:"Target costing & mark-up",sub:"2019 · 2022",b:li(["<b>Mark-up price</b> = cost × (1 + %). <b>Target cost</b> = selling price − required profit.","Current cost > target cost → cost gap; reduce design/manufacturing cost."])}
  ],tip:"මුලින්ම මේක පුරුදු වෙන්න — marks 40–60% මෙතනින්."},
 {n:5,t:"Economics – Demand & Supply",p:"hot",w:100,wl:"4 / 4 papers",s:"Demand · Supply · Equilibrium · Shifts · PPC · Market structures",tags:["2019","2022","2023","2024"],
  topics:[
   {t:"Equilibrium – solve the equations",h:1,sub:"2019 · 2023 · 2024",b:li(["<b>Qd = Qs</b> → solve for P → substitute to get Q (check with both).","Example: Qd = 5000 − 100P, Qs = 3000 + 300P → 2000 = 400P → <b>P = 5, Q = 4,500</b>.","Surplus (QS > QD) at high price · shortage at low price."])},
   {t:"Shifts of demand & supply",h:1,sub:"2019 · 2022",b:'<table><tr><th>Shift</th><th>P</th><th>Q</th></tr><tr><td>Demand ↑</td><td>↑</td><td>↑</td></tr><tr><td>Demand ↓</td><td>↓</td><td>↓</td></tr><tr><td>Supply ↑</td><td>↓</td><td>↑</td></tr><tr><td>Supply ↓</td><td>↑</td><td>↓</td></tr></table>'+tip("Demand shift → P & Q same direction. Supply shift → opposite.")},
   {t:"Law of demand & QD vs demand",sub:"2023",b:li(["Price ↑ → QD ↓ (negative relationship, ceteris paribus).","Change in <b>quantity</b> demanded = price only (movement along curve). Change in <b>demand</b> = other factors (curve shifts).","Factors: income, tastes, substitutes/complements, expectations, population."])},
   {t:"Supply & its factors",b:li(["Price ↑ → QS ↑. Shifts: technology, input prices, related goods, expectations, taxes/subsidies, number of suppliers."])},
   {t:"PPC & market structures",sub:"2024",b:li(["<b>PPF assumptions:</b> two goods · fixed resources · fixed technology · full employment.","On curve = efficient · inside = inefficient · outside = unattainable.","Perfect competition · Monopoly · Monopolistic · Oligopoly."])}
  ],tip:"Equations + shift diagrams පුරුදු කළොත් full marks."},
 {n:6,t:"Marketing & Value Chain",p:"mid",w:75,wl:"3 / 4 papers",s:"4Ps · Value chain · Pricing · Segmentation · Product levels",tags:["2019","2022","2024"],
  topics:[
   {t:"Marketing & 4Ps",b:li(["Marketing = identify, anticipate & profitably satisfy customer requirements.","<b>Product · Price · Place · Promotion</b>. Customer = buys; consumer = uses."])},
   {t:"Porter's Value Chain",sub:"2019 MCQ",b:li(["<b>Primary:</b> inbound logistics · operations · outbound logistics · marketing & sales · service.","<b>Support:</b> procurement · technology development · HRM · firm infrastructure."])},
   {t:"Pricing – skimming vs penetration †",h:1,sub:"2022 · 2024",b:li(["<b>Skimming</b> = high launch price (unique / luxury / niche).","<b>Penetration</b> = low price to gain share fast (mass, competitive market)."])},
   {t:"Segmentation, product levels, intermediaries †",sub:"2024",b:li(["Segments: geographic · demographic · psychographic · behavioural.","<b>Kotler's 5 levels:</b> core benefit → basic → expected → augmented → potential.","Intermediaries: reach, cost efficiency, expertise, storage, risk sharing."])}
  ],tip:"† = slides වල නෑ, නමුත් past papers වල ඇහුවා."},
 {n:3,t:"Managing People (HRM)",p:"mid",w:50,wl:"2 / 4 papers",s:"HRP · Recruitment · T&D · Rewards · Labour law",tags:["2019","2023"],
  topics:[
   {t:"Employees – a unique resource",h:1,sub:"2023 Q2(d)",b:li(["“Other resources make things possible; only people make things happen.” Decide on all resources, creative, appreciate with experience, hard to copy."])},
   {t:"HR planning – surplus & shortage",b:li(["Process: forecast demand → estimate supply → compare → strategies → evaluate.","<b>Surplus:</b> freeze hiring, attrition, early retirement, lay-off, termination. <b>Shortage:</b> overtime, subcontract, part-time, temporary, full-time hire."])},
   {t:"Recruitment & selection",h:1,b:li(["Internal: word of mouth, promotions, job postings. External: advertising, agencies, head-hunters, campus, referrals, e-recruitment.","Selection steps: screening → tests → interviews → references → medical → decision."])},
   {t:"Training & development",b:li(["On-the-job · job rotation · case study · understudy · assignments."])},

  ],tip:"Retention strategies & recruitment methods ප්‍රශ්න scenario එකකට."},
 {n:2,t:"Basics of Management",p:"mid",w:50,wl:"2 / 4 papers",s:"Functions · SMART · Leadership · Maslow · Tuckman",tags:["2019","2023"],
  topics:[
   {t:"Management functions & efficiency vs effectiveness",b:li(["<b>Planning · Organizing · Leading · Controlling.</b>","Effectiveness = doing the right things · Efficiency = doing things right."])},
   {t:"Vision → Mission → Goals → SMART objectives",h:1,sub:"2023 Q1(b)",b:li(["SMART: Specific · Measurable · Achievable · Rational · Time-bound.","Example: “Increase solar heater sales by 20% within 12 months.”"])},
   {t:"Leadership – Lewin's 3 styles",h:1,sub:"2023 Q1(d)",b:li(["<b>Autocratic</b> (alone) · <b>Participative</b> (involves group) · <b>Laissez-faire</b> (full freedom).","Pick one for the scenario and justify."])},
   {t:"Maslow's hierarchy",h:1,sub:"2023 Q1(c)",b:li(["Physiological → Security → Belongingness → Esteem → Self-actualization. Only unsatisfied needs motivate.","Apply to scenario: salary, job security, team, recognition, challenging work."])},
   {t:"Tuckman – team stages",sub:"2019 Q2",b:li(["<b>Forming</b> (anxious) → <b>Storming</b> (conflict) → <b>Norming</b> (cooperation) → <b>Performing</b> (goals achieved)."])}
  ],tip:"Scenario ප්‍රශ්න: තීරණයක් + හේතු."},
