const TRY={bmit:{"meta": {"title": "BMIT Final Exam 2024 (November)", "code": "IE3060 · Business Management for IT", "total": 100}, "slides": [{"id": "1a", "lab": "1(a)", "q": "Question 01", "marks": 4, "title": "PPF assumptions", "left": "<p class=\"qtx\"><b>a.<\/b> Identify the FOUR assumptions of a production possibility frontier.<\/p>", "steps": [{"h": "What is a PPF?", "b": "<p class=\"sn\">PPF (Production Possibility Frontier) කියන්නේ තියෙන resources සහ technology වලින් භාණ්ඩ <b>දෙකක්<\/b> නිපදවන්න පුළුවන් උපරිම combinations ටික පෙන්නන වක්‍රය. Marks 4 නිසා assumptions 4ක් එකින් එක ලියනවා.<\/p>"}, {"h": "Assumption 1", "b": "<div class=\"fa\">Only TWO goods are produced.<\/div><p class=\"sn\">Graph එකට axis දෙකයි — ඒ නිසා goods දෙකක් (උදා: calculators සහ toys).<\/p>"}, {"h": "Assumption 2", "b": "<div class=\"fa\">The quantity of resources is FIXED.<\/div><p class=\"sn\">Land, labour, capital දැන් තියෙන ප්‍රමාණයමයි; වැඩි වෙන්නේ නෑ.<\/p>"}, {"h": "Assumption 3", "b": "<div class=\"fa\">Technology is CONSTANT.<\/div><p class=\"sn\">නිෂ්පාදන ක්‍රම වෙනස් වෙන්නේ නෑ. අලුත් technology ආවොත් curve එක පිටතට shift වෙනවා.<\/p>"}, {"h": "Assumption 4", "b": "<div class=\"fa\">Resources are fully and efficiently employed (full employment).<\/div><p class=\"sn\">තියෙන සියලු resources පාවිච්චි වෙනවා; නාස්තියක් නෑ.<\/p>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>(1) (2) (3) (4) ලෙස number කරලා එක පේළියෙන් එකක් ලියන්න. Marks 4 = points 4.<\/div>"}]}, {"id": "1b", "lab": "1(b)", "q": "Question 01", "marks": 5, "title": "ANW Electronics: customer segments", "left": "<p class=\"qtx\"><b>b.<\/b> <i>\"ANW Electronics is a company that specializes in selling a wide range of smart home devices such as smart lights, security cameras, and smart thermostats. The company wants to expand its market reach and is looking into developing new marketing strategies tailored to different customer segments. The marketing team has identified that the target customers can vary based on their preferences, lifestyle, and purchasing power.\"<\/i><\/p><p class=\"qtx\">Identify <b>two<\/b> potential customer segments that ANW Electronics can target for its smart home devices. Explain why these segments are relevant for the company's marketing strategy.<\/p>", "steps": [{"h": "Start with one line: segmentation", "b": "<p class=\"sn\">මුලින් එක පේළියක් ලියන්න: <b>Market segmentation<\/b> = market එක සමාන අවශ්‍යතා / හැසිරීම් තියෙන customer groups වලට බෙදීම (demographic, geographic, psychographic, behavioural).<\/p><p class=\"sn\">දැන් scenario එකේ තියෙන 3 දේ බලන්න: <b>preferences, lifestyle, purchasing power<\/b> — segments ඒවායින් හොයාගන්න.<\/p>"}, {"h": "Segment 1", "b": "<div class=\"fa\">Tech-savvy young urban professionals<\/div><ul class=\"lst\"><li><b>Who:<\/b> 22 to 35 years, city apartments, comfortable with apps and online shopping (lifestyle + preferences).<\/li><li><b>Why relevant:<\/b> they want convenience and automation (smart lights, thermostats), are early adopters and buy readily online.<\/li><\/ul>"}, {"h": "Segment 2", "b": "<div class=\"fa\">Security-conscious home-owners and families<\/div><ul class=\"lst\"><li><b>Who:<\/b> medium to high income families who own houses (purchasing power).<\/li><li><b>Why relevant:<\/b> they value safety (cameras, smart locks) and are willing to pay more for reliable products.<\/li><\/ul>"}, {"h": "Link to the marketing strategy", "b": "<p class=\"sn\">අන්තිමට segments දෙකට වෙනම marketing strategy එකක් කියන්න — ඒකෙන් 'relevant' කියන කොටසට marks ලැබෙනවා.<\/p><table class=\"tb \"><thead><tr><th><\/th><th>Segment 1<\/th><th>Segment 2<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Product<\/td><td>App-controlled, easy-install kits<\/td><td>Security cameras + smart locks bundle<\/td><\/tr><tr class=\"\"><td>Price<\/td><td>Mid-range, instalment offers<\/td><td>Premium with warranty<\/td><\/tr><tr class=\"\"><td>Promotion<\/td><td>Social media, influencers<\/td><td>Home-safety campaigns, demos<\/td><\/tr><\/tbody><\/table>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>2 segments × (name + who + why relevant) + one-line definition = 5 marks. Segment නම ලියන එකම මදි — 'ඇයි relevant' කියන එක අනිවාර්යයි.<\/div>"}]}, {"id": "1c", "lab": "1(c)", "q": "Question 01", "marks": 1, "title": "Point F on the PPC", "left": "<p class=\"qtx\"><b>c.<\/b> Name the point \"F\" condition of the below production possibility curve in Figure 1.<\/p><div class=\"fig\"><svg viewBox=\"0 0 330 262\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, sans-serif\"><rect width=\"330\" height=\"262\" fill=\"#fff\"/><line x1=\"50\" y1=\"214\" x2=\"50\" y2=\"14\" stroke=\"#222\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"214\" x2=\"318\" y2=\"214\" stroke=\"#222\" stroke-width=\"1.5\"/><text x=\"4\" y=\"12\" font-size=\"10\" font-weight=\"700\">Toys<\/text><text x=\"160\" y=\"250\" font-size=\"10\" font-weight=\"700\">Calculators<\/text><line x1=\"46\" y1=\"166.5\" x2=\"50\" y2=\"166.5\" stroke=\"#222\"/><text x=\"22\" y=\"169.5\" font-size=\"9\">25<\/text><line x1=\"46\" y1=\"119.0\" x2=\"50\" y2=\"119.0\" stroke=\"#222\"/><text x=\"22\" y=\"122.0\" font-size=\"9\">50<\/text><line x1=\"46\" y1=\"71.5\" x2=\"50\" y2=\"71.5\" stroke=\"#222\"/><text x=\"22\" y=\"74.5\" font-size=\"9\">75<\/text><line x1=\"46\" y1=\"24.0\" x2=\"50\" y2=\"24.0\" stroke=\"#222\"/><text x=\"22\" y=\"27.0\" font-size=\"9\">100<\/text><line x1=\"112.0\" y1=\"214\" x2=\"112.0\" y2=\"218\" stroke=\"#222\"/><text x=\"104.0\" y=\"229\" font-size=\"9\">100<\/text><line x1=\"174.0\" y1=\"214\" x2=\"174.0\" y2=\"218\" stroke=\"#222\"/><text x=\"166.0\" y=\"229\" font-size=\"9\">200<\/text><line x1=\"236.0\" y1=\"214\" x2=\"236.0\" y2=\"218\" stroke=\"#222\"/><text x=\"228.0\" y=\"229\" font-size=\"9\">300<\/text><path d=\"M50.0,24.0 C60.3,26.2 91.3,29.4 112.0,37.3 C132.7,45.2 153.3,57.9 174.0,71.5 C194.7,85.1 221.0,95.2 236.0,119.0 C251.0,142.8 259.2,198.2 263.9,214.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.6\"/><line x1=\"50\" y1=\"71.5\" x2=\"174.0\" y2=\"71.5\" stroke=\"#777\" stroke-dasharray=\"3,3\"/><line x1=\"174.0\" y1=\"71.5\" x2=\"174.0\" y2=\"214\" stroke=\"#777\" stroke-dasharray=\"3,3\"/><line x1=\"50\" y1=\"119.0\" x2=\"236.0\" y2=\"119.0\" stroke=\"#777\" stroke-dasharray=\"3,3\"/><line x1=\"236.0\" y1=\"119.0\" x2=\"236.0\" y2=\"214\" stroke=\"#777\" stroke-dasharray=\"3,3\"/><circle cx=\"50.0\" cy=\"24.0\" r=\"4\" fill=\"#111\"/><text x=\"56.0\" y=\"22.0\" font-size=\"11\" font-weight=\"700\" fill=\"#111\">A<\/text><circle cx=\"174.0\" cy=\"71.5\" r=\"4\" fill=\"#111\"/><text x=\"174.0\" y=\"63.5\" font-size=\"11\" font-weight=\"700\" fill=\"#111\">C<\/text><circle cx=\"236.0\" cy=\"119.0\" r=\"4\" fill=\"#111\"/><text x=\"244.0\" y=\"115.0\" font-size=\"11\" font-weight=\"700\" fill=\"#111\">D<\/text><circle cx=\"263.9\" cy=\"214.0\" r=\"4\" fill=\"#111\"/><text x=\"269.9\" y=\"208.0\" font-size=\"11\" font-weight=\"700\" fill=\"#111\">B<\/text><circle cx=\"208.1\" cy=\"141.8\" r=\"4\" fill=\"#b00020\"/><text x=\"216.1\" y=\"145.8\" font-size=\"11\" font-weight=\"700\" fill=\"#b00020\">E<\/text><circle cx=\"254.6\" cy=\"71.5\" r=\"4\" fill=\"#b00020\"/><text x=\"262.6\" y=\"75.5\" font-size=\"11\" font-weight=\"700\" fill=\"#b00020\">F<\/text><\/svg><div class=\"cap\">Figure 1<\/div><\/div>", "steps": [{"h": "Look at where F is", "b": "<p class=\"sn\">F තියෙන්නේ curve එකට <b>පිටතින්<\/b> (ඉහළින් සහ දකුණින්).<\/p>"}, {"h": "Answer", "b": "<div class=\"fa\">Point F is UNATTAINABLE (not achievable) with the current resources and technology.<\/div><p class=\"sn\">1 mark නිසා එක වාක්‍යයක් ඇති; හේතුවත් එකතු කරන්න.<\/p>"}, {"h": "All the points together", "b": "<ul class=\"lst\"><li><b>A, C, D, B (on the curve)<\/b> = efficient: all resources fully used.<\/li><li><b>E (inside)<\/b> = inefficient: resources unemployed or wasted.<\/li><li><b>F (outside)<\/b> = unattainable: needs more resources or better technology (then the PPC shifts outward).<\/li><\/ul>"}]}, {"id": "1d", "lab": "1(d)", "q": "Question 01", "marks": 10, "title": "Kotler's five product levels", "left": "<p class=\"qtx\"><b>d.<\/b> Differentiate between the five product levels as proposed by Philip Kotler. Select a product of your choice and apply these five levels to explain how each level is represented.<\/p>", "steps": [{"h": "Product = more than the physical item", "b": "<p class=\"sn\">Philip Kotler ට අනුව product එකක ඉහළට යන තරමට customer value වැඩි වන <b>levels 5ක්<\/b> තියෙනවා. අපි product එකක් තෝරගන්නවා: <b>Smartphone<\/b> (ඕනම product එකක් තෝරන්න පුළුවන් — ඔයා හොඳින් දන්න එකක්).<\/p>"}, {"h": "Level 1: Core benefit", "b": "<div class=\"fa\">Core benefit<\/div><ul class=\"lst\"><li><b>Meaning:<\/b> The fundamental need or benefit the customer is really buying.<\/li><li><b>Smartphone:<\/b> Communication and staying connected (anytime, anywhere).<\/li><\/ul>"}, {"h": "Level 2: Basic product", "b": "<div class=\"fa\">Basic product<\/div><ul class=\"lst\"><li><b>Meaning:<\/b> The basic version with only the essential features that deliver the core benefit.<\/li><li><b>Smartphone:<\/b> A handset that can make calls, send messages, with a battery and a screen.<\/li><\/ul>"}, {"h": "Level 3: Expected product", "b": "<div class=\"fa\">Expected product<\/div><ul class=\"lst\"><li><b>Meaning:<\/b> The set of attributes and conditions buyers normally expect when they buy.<\/li><li><b>Smartphone:<\/b> A good camera, internet and apps, touch screen, all-day battery, reliable quality.<\/li><\/ul>"}, {"h": "Level 4: Augmented product", "b": "<div class=\"fa\">Augmented product<\/div><ul class=\"lst\"><li><b>Meaning:<\/b> Extra features and services that go beyond expectations and differentiate from competitors.<\/li><li><b>Smartphone:<\/b> 2-year warranty, free delivery, easy instalments, cloud storage, after-sales service, brand ecosystem.<\/li><\/ul>"}, {"h": "Level 5: Potential product", "b": "<div class=\"fa\">Potential product<\/div><ul class=\"lst\"><li><b>Meaning:<\/b> Possible future enhancements and transformations of the product.<\/li><li><b>Smartphone:<\/b> Foldable display, AI personal assistant, satellite connectivity, new health sensors.<\/li><\/ul>"}, {"h": "Differentiation summary (one table)", "b": "<table class=\"tb \"><thead><tr><th>Level<\/th><th>What it is<\/th><th>Smartphone<\/th><\/tr><\/thead><tbody><tr class=\"\"><td><b>Core benefit<\/b><\/td><td>The fundamental need or benefit the customer is really buying.<\/td><td>Communication and staying connected (anytime, anywhere).<\/td><\/tr><tr class=\"\"><td><b>Basic product<\/b><\/td><td>The basic version with only the essential features that deliver the core benefit.<\/td><td>A handset that can make calls, send messages, with a battery and a screen.<\/td><\/tr><tr class=\"\"><td><b>Expected product<\/b><\/td><td>The set of attributes and conditions buyers normally expect when they buy.<\/td><td>A good camera, internet and apps, touch screen, all-day battery, reliable quality.<\/td><\/tr><tr class=\"\"><td><b>Augmented product<\/b><\/td><td>Extra features and services that go beyond expectations and differentiate from competitors.<\/td><td>2-year warranty, free delivery, easy instalments, cloud storage, after-sales service, brand ecosystem.<\/td><\/tr><tr class=\"\"><td><b>Potential product<\/b><\/td><td>Possible future enhancements and transformations of the product.<\/td><td>Foldable display, AI personal assistant, satellite connectivity, new health sensors.<\/td><\/tr><\/tbody><\/table>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>Marks 10 = levels 5 × 2. හැම level එකකටම <b>definition + product එකේ උදාහරණය<\/b> ලියන්න. Differentiate කියන නිසා level එකින් එක වෙනස පැහැදිලි වෙන්න ලියන්න.<\/div>"}]}, {"id": "1e", "lab": "1(e)", "q": "Question 01", "marks": 5, "title": "Penetration pricing vs price skimming", "left": "<p class=\"qtx\"><b>e.<\/b> Differentiate between penetration pricing and price skimming.<\/p>", "steps": [{"h": "Penetration pricing", "b": "<div class=\"fa\">Low launch price to win market share quickly<\/div><ul class=\"lst\"><li>Price is set LOW at launch to attract many customers and gain a large share fast.<\/li><li>Suits a price-sensitive mass market with many competitors.<\/li><li>Example: a new mobile data package at a very low price.<\/li><\/ul>"}, {"h": "Price skimming", "b": "<div class=\"fa\">High launch price, reduced later<\/div><ul class=\"lst\"><li>Price is set HIGH at launch to earn maximum profit from early buyers; reduced as competitors arrive.<\/li><li>Suits a new, unique or innovative product with a brand-conscious segment and few competitors.<\/li><li>Example: a new flagship smartphone.<\/li><\/ul>"}, {"h": "Differentiation table", "b": "<table class=\"tb \"><thead><tr><th><\/th><th>Penetration pricing<\/th><th>Price skimming<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Launch price<\/td><td>Low<\/td><td>High, reduced later<\/td><\/tr><tr class=\"\"><td>Objective<\/td><td>Market share and volume<\/td><td>Early profit, recover R&amp;D, premium image<\/td><\/tr><tr class=\"\"><td>Target market<\/td><td>Price-sensitive mass market<\/td><td>Brand-conscious, less price-sensitive<\/td><\/tr><tr class=\"\"><td>Competition<\/td><td>Many competitors<\/td><td>Few competitors at launch<\/td><\/tr><tr class=\"\"><td>Risk<\/td><td>Low profit per unit<\/td><td>Slow sales, attracts competitors<\/td><\/tr><\/tbody><\/table>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>Differentiate = දෙපැත්තම ලියන්න. Table එකක් ලියුවොත් ඉක්මනින් marks ගන්න පුළුවන්.<\/div>"}]}, {"id": "2a", "lab": "2(a)", "q": "Question 02", "marks": 5, "title": "Why producers use intermediaries", "left": "<p class=\"qtx\"><b>a.<\/b> Explain the reasons to seek assistance from intermediaries in selling product by producers.<\/p>", "steps": [{"h": "Idea", "b": "<p class=\"sn\">Intermediaries = wholesalers, retailers, agents. Producer ට නිෂ්පාදනය කරන්න පුළුවන්, හැබැයි customers ට ළඟා වෙන්න අමාරුයි. ඒකයි ඔවුන්ගේ උදව් ගන්නේ. හේතු 5ක් ලියන්න.<\/p>"}, {"h": "Reason 1", "b": "<div class=\"fa\">Wider market reach<\/div><p class=\"sn\">Retailers/wholesalers ළඟ customers ගොඩක් ඉන්නවා; producer තනියම ඒ හැමෝටම ළඟා වෙන්න අමාරුයි.<\/p>"}, {"h": "Reason 2", "b": "<div class=\"fa\">Cost efficiency<\/div><p class=\"sn\">තමන්ගේම distribution network එකක් හදනවාට වඩා ලාබයි. Transport සහ contacts වල economies of scale.<\/p>"}, {"h": "Reason 3", "b": "<div class=\"fa\">Expertise and local market knowledge<\/div><p class=\"sn\">Selling, promotion, customer handling වල අත්දැකීම් තියෙනවා; producer ට නිෂ්පාදනයට focus කරන්න පුළුවන්.<\/p>"}, {"h": "Reason 4", "b": "<div class=\"fa\">Storage, transport and breaking bulk<\/div><p class=\"sn\">භාණ්ඩ ගබඩා කරලා, customers ළඟ තියලා, ලොකු ප්‍රමාණ කුඩා ප්‍රමාණ වලට බෙදලා දෙනවා.<\/p>"}, {"h": "Reason 5", "b": "<div class=\"fa\">Risk sharing and financing<\/div><p class=\"sn\">Stock තියාගැනීමේ අවදානම intermediary බාර ගන්නවා; සමහර වෙලාවට credit දෙනවා.<\/p>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>Marks 5 = reasons 5, හැම එකකටම heading + එක පේළියක් ලියන්න.<\/div>"}]}, {"id": "2b12", "lab": "2(b) 1, 2", "q": "Question 02", "marks": 4, "title": "Shortage / surplus and equilibrium", "left": "<p class=\"qtx\"><b>b.<\/b> Consider the following supply and demand model of the world tea market (in billions of pounds) given in Table 1 and compute the following questions.<\/p><table class=\"tb paper\"><thead><tr><th>Price per Pound<\/th><th>Quantity Supplied<\/th><th>Quantity Demanded<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>$38<\/td><td>1,500<\/td><td>525<\/td><\/tr><tr class=\"\"><td>$37<\/td><td>1,000<\/td><td>600<\/td><\/tr><tr class=\"\"><td>$36<\/td><td>700<\/td><td>700<\/td><\/tr><tr class=\"\"><td>$35<\/td><td>600<\/td><td>900<\/td><\/tr><tr class=\"\"><td>$34<\/td><td>550<\/td><td>1,200<\/td><\/tr><\/tbody><\/table><p class=\"qtx\"><b>1.<\/b> Evaluate whether there is a shortage or a surplus when the price is at $38 and $34 respectively. <span class=\"mk\">(02 marks)<\/span><\/p><p class=\"qtx\"><b>2.<\/b> Calculate the equilibrium price and the equilibrium quantity. <span class=\"mk\">(02 marks)<\/span><\/p>", "steps": [{"h": "The rule", "b": "<p class=\"sn\">Price වැඩි නම් producers ගොඩක් සපයනවා, ගන්න අය අඩුයි → <b>QS &gt; QD = Surplus<\/b>. Price අඩු නම් ගන්න අය වැඩියි → <b>QD &gt; QS = Shortage<\/b>.<\/p><table class=\"tb \"><thead><tr><th>Condition<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Quantity supplied &gt; Quantity demanded<\/td><td>Surplus = QS &minus; QD<\/td><\/tr><tr class=\"\"><td>Quantity demanded &gt; Quantity supplied<\/td><td>Shortage = QD &minus; QS<\/td><\/tr><\/tbody><\/table>"}, {"h": "Part 1: price $38", "b": "<ul class=\"lst\"><li>QS = 1,500 and QD = 525<\/li><li>QS &gt; QD, so there is a surplus<\/li><li>Surplus = 1,500 &minus; 525 = 975<\/li><\/ul><div class=\"fa\">$38: SURPLUS of 975 billion pounds<\/div>"}, {"h": "Part 1: price $34", "b": "<ul class=\"lst\"><li>QS = 550 and QD = 1,200<\/li><li>QD &gt; QS, so there is a shortage<\/li><li>Shortage = 1,200 &minus; 550 = 650<\/li><\/ul><div class=\"fa\">$34: SHORTAGE of 650 billion pounds<\/div>"}, {"h": "Part 2: equilibrium", "b": "<p class=\"sn\">Equilibrium = QS සහ QD සමාන වන තැන. Table එකේ හොයන්න.<\/p><ul class=\"lst\"><li>At $36: QS = 700 and QD = 700 → equal.<\/li><\/ul><div class=\"fa\">Equilibrium price = $36, equilibrium quantity = 700 billion pounds<\/div>"}, {"h": "Check the other rows", "b": "<ul class=\"lst\"><li>$37: QS 1,000 vs QD 600 → surplus 400<\/li><li>$35: QS 600 vs QD 900 → shortage 300<\/li><\/ul><p class=\"sn\">$36 එකම balance වෙන price එක බව confirm වෙනවා.<\/p>"}]}, {"id": "2b34", "lab": "2(b) 3, 4", "q": "Question 02", "marks": 7, "title": "Draw the curves and label equilibrium", "left": "<p class=\"qtx\"><b>3.<\/b> Draw the supply curve and the demand curve. <span class=\"mk\">(05 marks)<\/span><\/p><p class=\"qtx\"><b>4.<\/b> Label the equilibrium price and quantity on the graph in Part iii above. <span class=\"mk\">(02 marks)<\/span><\/p><table class=\"tb paper\"><thead><tr><th>Price per Pound<\/th><th>Quantity Supplied<\/th><th>Quantity Demanded<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>$38<\/td><td>1,500<\/td><td>525<\/td><\/tr><tr class=\"\"><td>$37<\/td><td>1,000<\/td><td>600<\/td><\/tr><tr class=\"\"><td>$36<\/td><td>700<\/td><td>700<\/td><\/tr><tr class=\"\"><td>$35<\/td><td>600<\/td><td>900<\/td><\/tr><tr class=\"\"><td>$34<\/td><td>550<\/td><td>1,200<\/td><\/tr><\/tbody><\/table>", "steps": [{"h": "Step 1: axes", "b": "<ul class=\"lst\"><li><b>Y axis:<\/b> Price per pound ($34 to $38)<\/li><li><b>X axis:<\/b> Quantity (billion pounds): 0 to 1,600<\/li><li>Write the units and equal scales<\/li><\/ul><p class=\"sn\">Axes දෙකට නම් සහ units ලියන්න. Scale එක සමාන පරතරයෙන්.<\/p>"}, {"h": "Step 2: plot the supply curve", "b": "<ul class=\"lst\"><li>Points: (550, $34), (600, $35), (700, $36), (1,000, $37), (1,500, $38)<\/li><li>Join them: the curve slopes UPWARD<\/li><\/ul><p class=\"sn\">Price ඉහළ ගියාම supply වැඩි වෙනවා. ඒ නිසා ඉහළට යනවා. 'S' ලෙස label කරන්න.<\/p>"}, {"h": "Step 3: plot the demand curve", "b": "<ul class=\"lst\"><li>Points: (1,200, $34), (900, $35), (700, $36), (600, $37), (525, $38)<\/li><li>Join them: the curve slopes DOWNWARD<\/li><\/ul><p class=\"sn\">Price ඉහළ ගියාම demand අඩු වෙනවා. 'D' ලෙස label කරන්න.<\/p>"}, {"h": "Step 4: label the equilibrium", "b": "<div class=\"fa\">E: price $36, quantity 700<\/div><p class=\"sn\">Curves දෙක ඡේදනය වන තැන E. එතැනින් axes දෙකට dotted lines අඳින්න; $36 සහ 700 ලියන්න.<\/p><div class=\"fig\"><svg viewBox=\"0 0 330 235\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, sans-serif\"><rect width=\"330\" height=\"235\" fill=\"#fff\"/><line x1=\"50\" y1=\"196\" x2=\"50\" y2=\"10\" stroke=\"#222\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"196\" x2=\"318\" y2=\"196\" stroke=\"#222\" stroke-width=\"1.5\"/><text x=\"2\" y=\"12\" font-size=\"9.5\" font-weight=\"700\">Price ($ per lb)<\/text><text x=\"180\" y=\"226\" font-size=\"9.5\" font-weight=\"700\">Quantity (billion lb)<\/text><line x1=\"47\" y1=\"173.0\" x2=\"50\" y2=\"173.0\" stroke=\"#222\"/><text x=\"30\" y=\"176.0\" font-size=\"9\">34<\/text><line x1=\"47\" y1=\"139.0\" x2=\"50\" y2=\"139.0\" stroke=\"#222\"/><text x=\"30\" y=\"142.0\" font-size=\"9\">35<\/text><line x1=\"47\" y1=\"105.0\" x2=\"50\" y2=\"105.0\" stroke=\"#222\"/><text x=\"30\" y=\"108.0\" font-size=\"9\">36<\/text><line x1=\"47\" y1=\"71.0\" x2=\"50\" y2=\"71.0\" stroke=\"#222\"/><text x=\"30\" y=\"74.0\" font-size=\"9\">37<\/text><line x1=\"47\" y1=\"37.0\" x2=\"50\" y2=\"37.0\" stroke=\"#222\"/><text x=\"30\" y=\"40.0\" font-size=\"9\">38<\/text><text x=\"40.0\" y=\"209\" font-size=\"9\">0<\/text><text x=\"102.0\" y=\"209\" font-size=\"9\">400<\/text><text x=\"164.0\" y=\"209\" font-size=\"9\">800<\/text><text x=\"226.0\" y=\"209\" font-size=\"9\">1200<\/text><text x=\"288.0\" y=\"209\" font-size=\"9\">1600<\/text><polyline fill=\"none\" stroke=\"#b45309\" stroke-width=\"2.4\" points=\"135.2,173.0 143.0,139.0 158.5,105.0 205.0,71.0 282.5,37.0\"/><polyline fill=\"none\" stroke=\"#1f4e8c\" stroke-width=\"2.4\" points=\"236.0,173.0 189.5,139.0 158.5,105.0 143.0,71.0 131.4,37.0\"/><text x=\"286.5\" y=\"32.0\" font-size=\"10\" font-weight=\"700\" fill=\"#b45309\">S<\/text><text x=\"240.0\" y=\"177.0\" font-size=\"10\" font-weight=\"700\" fill=\"#1f4e8c\">D<\/text><circle cx=\"158.5\" cy=\"105.0\" r=\"3.8\" fill=\"#b45309\"/><line x1=\"50\" y1=\"105.0\" x2=\"158.5\" y2=\"105.0\" stroke=\"#b45309\" stroke-dasharray=\"3,3\"/><line x1=\"158.5\" y1=\"105.0\" x2=\"158.5\" y2=\"196\" stroke=\"#b45309\" stroke-dasharray=\"3,3\"/><text x=\"163.5\" y=\"100.0\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\">E ($36, 700)<\/text><\/svg><\/div>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>Marks 5 = axes + units, scale, points plotted, S සහ D label, smooth lines. E point එකේ dotted lines අමතක කරන්න එපා.<\/div>"}]}, {"id": "2b5", "lab": "2(b) 5", "q": "Question 02", "marks": 9, "title": "Drought: new supply schedule and new equilibrium", "left": "<p class=\"qtx\"><b>5.<\/b> Assume there is a drought in Sri Lanka that reduced the supply of tea by 400 billion pounds and this did not affect the price and demand for tea.<\/p><p class=\"qtx\"><b>i.<\/b> Draw a table and write the new supply schedule for tea. <span class=\"mk\">(05 marks)<\/span><\/p><p class=\"qtx\"><b>ii.<\/b> Find the new equilibrium price and the new equilibrium quantity. <span class=\"mk\">(04 marks)<\/span><\/p><table class=\"tb paper\"><thead><tr><th>Price per Pound<\/th><th>Quantity Supplied<\/th><th>Quantity Demanded<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>$38<\/td><td>1,500<\/td><td>525<\/td><\/tr><tr class=\"\"><td>$37<\/td><td>1,000<\/td><td>600<\/td><\/tr><tr class=\"\"><td>$36<\/td><td>700<\/td><td>700<\/td><\/tr><tr class=\"\"><td>$35<\/td><td>600<\/td><td>900<\/td><\/tr><tr class=\"\"><td>$34<\/td><td>550<\/td><td>1,200<\/td><\/tr><\/tbody><\/table>", "steps": [{"h": "What happened?", "b": "<p class=\"sn\">Drought නිසා <b>හැම price එකකදීම supply එක 400 කින් අඩුයි<\/b>. Demand වෙනස් වෙන්නේ නෑ. එනම් supply curve එක <b>වමට shift<\/b> වෙනවා.<\/p>"}, {"h": "Part i: new supply schedule", "b": "<p class=\"sn\">Old QS වලින් 400 අඩු කරන්න:<\/p><table class=\"tb \"><thead><tr><th>Price<\/th><th>Old QS<\/th><th>&minus; 400<\/th><th>New QS<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>$38<\/td><td>1,500<\/td><td>&minus;400<\/td><td><b>1,100<\/b><\/td><\/tr><tr class=\"\"><td>$37<\/td><td>1,000<\/td><td>&minus;400<\/td><td><b>600<\/b><\/td><\/tr><tr class=\"\"><td>$36<\/td><td>700<\/td><td>&minus;400<\/td><td><b>300<\/b><\/td><\/tr><tr class=\"\"><td>$35<\/td><td>600<\/td><td>&minus;400<\/td><td><b>200<\/b><\/td><\/tr><tr class=\"\"><td>$34<\/td><td>550<\/td><td>&minus;400<\/td><td><b>150<\/b><\/td><\/tr><\/tbody><\/table><div class=\"fa\">New supply: 1,100 / 600 / 300 / 200 / 150<\/div>"}, {"h": "Part ii: find where new QS = QD", "b": "<table class=\"tb num\"><thead><tr><th>Price<\/th><th>New QS<\/th><th>QD (unchanged)<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>$38<\/td><td>1,100<\/td><td>525<\/td><td>Surplus 575<\/td><\/tr><tr class=\"\"><td>$37<\/td><td>600<\/td><td>600<\/td><td><b>Equal<\/b><\/td><\/tr><tr class=\"\"><td>$36<\/td><td>300<\/td><td>700<\/td><td>Shortage 400<\/td><\/tr><tr class=\"\"><td>$35<\/td><td>200<\/td><td>900<\/td><td>Shortage 700<\/td><\/tr><tr class=\"\"><td>$34<\/td><td>150<\/td><td>1,200<\/td><td>Shortage 1,050<\/td><\/tr><\/tbody><\/table>"}, {"h": "Answer", "b": "<div class=\"fa\">New equilibrium: price $37, quantity 600 billion pounds<\/div>"}, {"h": "Compare with the old equilibrium", "b": "<ul class=\"lst\"><li>Price: $36 → $37 (UP)<\/li><li>Quantity: 700 → 600 (DOWN)<\/li><li>Supply falls, demand same: price rises and quantity falls<\/li><\/ul><div class=\"fig\"><svg viewBox=\"0 0 330 235\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, sans-serif\"><rect width=\"330\" height=\"235\" fill=\"#fff\"/><line x1=\"50\" y1=\"196\" x2=\"50\" y2=\"10\" stroke=\"#222\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"196\" x2=\"318\" y2=\"196\" stroke=\"#222\" stroke-width=\"1.5\"/><text x=\"2\" y=\"12\" font-size=\"9.5\" font-weight=\"700\">Price ($ per lb)<\/text><text x=\"180\" y=\"226\" font-size=\"9.5\" font-weight=\"700\">Quantity (billion lb)<\/text><line x1=\"47\" y1=\"173.0\" x2=\"50\" y2=\"173.0\" stroke=\"#222\"/><text x=\"30\" y=\"176.0\" font-size=\"9\">34<\/text><line x1=\"47\" y1=\"139.0\" x2=\"50\" y2=\"139.0\" stroke=\"#222\"/><text x=\"30\" y=\"142.0\" font-size=\"9\">35<\/text><line x1=\"47\" y1=\"105.0\" x2=\"50\" y2=\"105.0\" stroke=\"#222\"/><text x=\"30\" y=\"108.0\" font-size=\"9\">36<\/text><line x1=\"47\" y1=\"71.0\" x2=\"50\" y2=\"71.0\" stroke=\"#222\"/><text x=\"30\" y=\"74.0\" font-size=\"9\">37<\/text><line x1=\"47\" y1=\"37.0\" x2=\"50\" y2=\"37.0\" stroke=\"#222\"/><text x=\"30\" y=\"40.0\" font-size=\"9\">38<\/text><text x=\"40.0\" y=\"209\" font-size=\"9\">0<\/text><text x=\"102.0\" y=\"209\" font-size=\"9\">400<\/text><text x=\"164.0\" y=\"209\" font-size=\"9\">800<\/text><text x=\"226.0\" y=\"209\" font-size=\"9\">1200<\/text><text x=\"288.0\" y=\"209\" font-size=\"9\">1600<\/text><polyline fill=\"none\" stroke=\"#b45309\" stroke-width=\"2.4\" points=\"135.2,173.0 143.0,139.0 158.5,105.0 205.0,71.0 282.5,37.0\"/><polyline fill=\"none\" stroke=\"#1f4e8c\" stroke-width=\"2.4\" points=\"236.0,173.0 189.5,139.0 158.5,105.0 143.0,71.0 131.4,37.0\"/><polyline fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"2.8\" points=\"73.2,173.0 81.0,139.0 96.5,105.0 143.0,71.0 220.5,37.0\"/><text x=\"286.5\" y=\"32.0\" font-size=\"10\" font-weight=\"700\" fill=\"#b45309\">S<\/text><text x=\"240.0\" y=\"177.0\" font-size=\"10\" font-weight=\"700\" fill=\"#1f4e8c\">D<\/text><text x=\"224.5\" y=\"31.0\" font-size=\"10\" font-weight=\"700\" fill=\"#7c3aed\">S1 (drought)<\/text><circle cx=\"158.5\" cy=\"105.0\" r=\"3.8\" fill=\"#b45309\"/><line x1=\"50\" y1=\"105.0\" x2=\"158.5\" y2=\"105.0\" stroke=\"#b45309\" stroke-dasharray=\"3,3\"/><line x1=\"158.5\" y1=\"105.0\" x2=\"158.5\" y2=\"196\" stroke=\"#b45309\" stroke-dasharray=\"3,3\"/><text x=\"163.5\" y=\"100.0\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\">E ($36, 700)<\/text><circle cx=\"143.0\" cy=\"71.0\" r=\"3.8\" fill=\"#7c3aed\"/><line x1=\"50\" y1=\"71.0\" x2=\"143.0\" y2=\"71.0\" stroke=\"#7c3aed\" stroke-dasharray=\"3,3\"/><line x1=\"143.0\" y1=\"71.0\" x2=\"143.0\" y2=\"196\" stroke=\"#7c3aed\" stroke-dasharray=\"3,3\"/><text x=\"148.0\" y=\"66.0\" font-size=\"9.5\" font-weight=\"700\" fill=\"#7c3aed\">E1 ($37, 600)<\/text><\/svg><\/div>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>New table එකේ column එකක් ලෙස old QS, −400, new QS පෙන්නුවොත් working marks ලැබෙනවා.<\/div>"}]}, {"id": "3a1", "lab": "3(a) 1", "q": "Question 03", "marks": 10, "title": "Compute the financial ratios", "left": "<p class=\"qtx\"><b>a.<\/b> Consider the following Profit &amp; Loss Statement and the Balance Sheet for the year 2023 of the Kottu Factory Company in Table 2 and 3.<\/p><table class=\"tb paper\"><thead><tr><th>Table 2 · Profit &amp; Loss (in $000)<\/th><th><\/th><\/tr><\/thead><tbody><tr class=\"\"><td><b>Revenue<\/b><\/td><td>500,000<\/td><\/tr><tr class=\"\"><td>Less: Cost of Goods Sold (COGS)<\/td><td>350,000<\/td><\/tr><tr class=\"tot\"><td><b>Gross Profit<\/b><\/td><td>150,000<\/td><\/tr><tr class=\"\"><td>Salaries and Wages<\/td><td>25,000<\/td><\/tr><tr class=\"\"><td>Rent and Utilities<\/td><td>10,000<\/td><\/tr><tr class=\"\"><td>Depreciation<\/td><td>5,000<\/td><\/tr><tr class=\"\"><td>Marketing and Advertising<\/td><td>10,000<\/td><\/tr><tr class=\"\"><td><b>Total Operating Expenses<\/b><\/td><td>50,000<\/td><\/tr><tr class=\"tot\"><td><b>Operating Profit<\/b><\/td><td>100,000<\/td><\/tr><tr class=\"\"><td>Less: Interest Expense<\/td><td>5,000<\/td><\/tr><tr class=\"\"><td><b>Net Profit Before Tax (NPBT)<\/b><\/td><td>95,000<\/td><\/tr><tr class=\"\"><td>Less: Tax Expense<\/td><td>20,000<\/td><\/tr><tr class=\"tot\"><td><b>Net Profit After Tax (NPAT)<\/b><\/td><td>75,000<\/td><\/tr><\/tbody><\/table><table class=\"tb paper\"><thead><tr><th>Table 3 · Balance Sheet (in $000)<\/th><th><\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Property, Plant &amp; Equipment<\/td><td>250,000<\/td><\/tr><tr class=\"\"><td>Intangible Assets<\/td><td>50,000<\/td><\/tr><tr class=\"\"><td><b>Total Non-Current Assets<\/b><\/td><td>300,000<\/td><\/tr><tr class=\"\"><td>Cash and Cash Equivalents<\/td><td>100,000<\/td><\/tr><tr class=\"\"><td>Accounts Receivable<\/td><td>50,000<\/td><\/tr><tr class=\"\"><td>Inventory<\/td><td>75,000<\/td><\/tr><tr class=\"\"><td><b>Total Current Assets<\/b><\/td><td>225,000<\/td><\/tr><tr class=\"tot\"><td><b>Total Assets<\/b><\/td><td>525,000<\/td><\/tr><tr class=\"\"><td>Share Capital<\/td><td>250,000<\/td><\/tr><tr class=\"\"><td>Retained Earnings<\/td><td>100,000<\/td><\/tr><tr class=\"\"><td><b>Total Equity<\/b><\/td><td>350,000<\/td><\/tr><tr class=\"\"><td>Long-term Debt (Total Non-Current Liabilities)<\/td><td>100,000<\/td><\/tr><tr class=\"\"><td>Accounts Payable<\/td><td>50,000<\/td><\/tr><tr class=\"\"><td>Short-term Debt<\/td><td>25,000<\/td><\/tr><tr class=\"\"><td><b>Total Current Liabilities<\/b><\/td><td>75,000<\/td><\/tr><tr class=\"tot\"><td><b>Total Equity and Liabilities<\/b><\/td><td>525,000<\/td><\/tr><\/tbody><\/table><p class=\"qtx\"><b>1.<\/b> Compute the following financial ratios; <span class=\"mk\">(10 marks)<\/span><br>i. Profitability Ratio: Net Profit Margin and Gross Profit Margin<br>ii. Liquidity Ratio: Current Ratio<br>iii. Activity Ratio: Inventory Turnover Ratio<br>iv. Debt Ratio: Debt-to-Equity Ratio<\/p>", "steps": [{"h": "Step 0: collect the numbers you need", "b": "<p class=\"sn\">මුලින්ම statements දෙකෙන් ratios වලට ඕනේ numbers ටික ගන්න. (මෙතන ඔක්කොම $000)<\/p><table class=\"tb \"><thead><tr><th>From the P&amp;L<\/th><th><\/th><th>From the Balance Sheet<\/th><th><\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Revenue<\/td><td>500,000<\/td><td>Current assets<\/td><td>225,000<\/td><\/tr><tr class=\"\"><td>COGS<\/td><td>350,000<\/td><td>Current liabilities<\/td><td>75,000<\/td><\/tr><tr class=\"\"><td>Gross profit<\/td><td>150,000<\/td><td>Inventory<\/td><td>75,000<\/td><\/tr><tr class=\"\"><td>Net profit after tax (NPAT)<\/td><td>75,000<\/td><td>Long-term debt + short-term debt<\/td><td>100,000 + 25,000<\/td><\/tr><tr class=\"\"><td><\/td><td><\/td><td>Total equity<\/td><td>350,000<\/td><\/tr><\/tbody><\/table>"}, {"h": "i. Gross Profit Margin", "b": "<p class=\"sn\">Revenue රුපියල් 100කින් COGS අඩු කළාම ඉතිරි වෙන ප්‍රමාණය.<\/p><div class=\"calc\"><span>Formula<\/span> Gross Profit ÷ Revenue × 100<\/div><div class=\"calc\"><span>Substitute<\/span> 150,000 ÷ 500,000 × 100<\/div><div class=\"fa\">Gross Profit Margin = 30%<\/div>"}, {"h": "i. Net Profit Margin", "b": "<p class=\"sn\">Net profit = tax ගෙවූ පසු ලාභය (NPAT). Revenue රුපියල් 100කින් අන්තිමට ඉතිරි වෙන ප්‍රමාණය.<\/p><div class=\"calc\"><span>Formula<\/span> Net Profit (NPAT) ÷ Revenue × 100<\/div><div class=\"calc\"><span>Substitute<\/span> 75,000 ÷ 500,000 × 100<\/div><div class=\"fa\">Net Profit Margin = 15%<\/div><p class=\"sn\">NPBT (95,000) පාවිච්චි කළොත් 19%. ඒත් 'Net profit' = NPAT ලෙස ගන්න; ලියන්නත් එහෙමයි.<\/p>"}, {"h": "ii. Current Ratio", "b": "<p class=\"sn\">කෙටි කාලීන ණය ගෙවන්න current assets වලට පුළුවන්ද?<\/p><div class=\"calc\"><span>Formula<\/span> Current Assets ÷ Current Liabilities<\/div><div class=\"calc\"><span>Substitute<\/span> 225,000 ÷ 75,000<\/div><div class=\"fa\">Current Ratio = 3.0 : 1<\/div>"}, {"h": "iii. Inventory Turnover", "b": "<p class=\"sn\">අවුරුද්දකට stock එක කී වතාවක් විකිණිලා අලුත් වෙනවද?<\/p><div class=\"calc\"><span>Formula<\/span> COGS ÷ Inventory<\/div><div class=\"calc\"><span>Substitute<\/span> 350,000 ÷ 75,000<\/div><div class=\"fa\">Inventory Turnover = 4.67 times (about 78 days to sell: 365 ÷ 4.67)<\/div><p class=\"sn\">Closing inventory එක විතරයි දීලා තියෙන්නේ; ඒක පාවිච්චි කරන්න (average inventory නෑ).<\/p>"}, {"h": "iv. Debt-to-Equity", "b": "<p class=\"sn\">'Debt' කියන්නේ මොකක්ද කියලා ඔයාම තීරණය කරලා ලියන්න (අනිවාර්යයි).<\/p><div class=\"calc\"><span>Formula<\/span> Total Debt ÷ Total Equity<\/div><div class=\"calc\"><span>Interest-bearing debt<\/span> (100,000 + 25,000) ÷ 350,000 = 0.357<\/div><div class=\"calc\"><span>Or total liabilities<\/span> 175,000 ÷ 350,000 = 0.50<\/div><div class=\"fa\">Debt-to-Equity = 0.36 (or 0.50 if all liabilities are counted)<\/div>"}, {"h": "Summary table", "b": "<table class=\"tb \"><thead><tr><th>Ratio<\/th><th>Formula<\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Gross Profit Margin<\/td><td>GP ÷ Revenue × 100<\/td><td><b>30%<\/b><\/td><\/tr><tr class=\"\"><td>Net Profit Margin<\/td><td>NPAT ÷ Revenue × 100<\/td><td><b>15%<\/b><\/td><\/tr><tr class=\"\"><td>Current Ratio<\/td><td>CA ÷ CL<\/td><td><b>3.0 : 1<\/b><\/td><\/tr><tr class=\"\"><td>Inventory Turnover<\/td><td>COGS ÷ Inventory<\/td><td><b>4.67 times<\/b><\/td><\/tr><tr class=\"\"><td>Debt-to-Equity<\/td><td>Debt ÷ Equity<\/td><td><b>0.36<\/b> (0.50)<\/td><\/tr><\/tbody><\/table><div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>Marks 10 = ratios 5 × 2. Formula, substitution, answer තුනම ලියන්න.<\/div>"}]}, {"id": "3a2", "lab": "3(a) 2", "q": "Question 03", "marks": 10, "title": "Interpret the ratios", "left": "<p class=\"qtx\"><b>2.<\/b> Interpret financial performance of Kottu Factory Ltd based on the ratios you calculated in part a. <span class=\"mk\">(10 marks)<\/span><\/p><table class=\"tb paper\"><thead><tr><th>Ratio (from part 1)<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Gross Profit Margin<\/td><td>30%<\/td><\/tr><tr class=\"\"><td>Net Profit Margin<\/td><td>15%<\/td><\/tr><tr class=\"\"><td>Current Ratio<\/td><td>3.0 : 1<\/td><\/tr><tr class=\"\"><td>Inventory Turnover<\/td><td>4.67 times (about 78 days)<\/td><\/tr><tr class=\"\"><td>Debt-to-Equity<\/td><td>0.36 (or 0.50 on total liabilities)<\/td><\/tr><\/tbody><\/table>", "steps": [{"h": "The template (use it for every ratio)", "b": "<div class=\"fa\">Ratio says … → good / bad (benchmark) → because … → suggestion<\/div><p class=\"sn\">එක ratio එකක් = වාක්‍ය 3ක් 4ක්. එක year එකක් විතරයි දීලා තියෙන නිසා benchmarks (current 2.0, quick 1.0) එක්ක සසඳන්න.<\/p>"}, {"h": "Profitability: GP 30%, Net 15%", "b": "<ul class=\"lst\"><li>Of every $100 of sales, $30 remains after the cost of goods and $15 remains as net profit.<\/li><li>Operating expenses are 10% of revenue (50,000 ÷ 500,000), interest 1% and tax 4%: all well controlled.<\/li><li><b>Good:<\/b> a healthy margin. <b>Suggestion:<\/b> negotiate supplier prices to lift the gross margin; keep marketing spend effective.<\/li><\/ul>"}, {"h": "Liquidity: Current ratio 3.0", "b": "<ul class=\"lst\"><li>The company holds $3 of current assets for every $1 of short-term debt; above the usual 2.0 benchmark.<\/li><li>Quick ratio = (225,000 &minus; 75,000) ÷ 75,000 = 2.0 (above 1.0), so it can pay even without selling stock.<\/li><li><b>Good:<\/b> very safe. <b>But<\/b> it may be too high: cash of 100,000 is idle. <b>Suggestion:<\/b> invest it in expansion.<\/li><\/ul>"}, {"h": "Efficiency: Inventory turnover 4.67", "b": "<ul class=\"lst\"><li>Stock is sold and replaced about 4.7 times a year (about 78 days to sell).<\/li><li><b>Moderate:<\/b> no industry figure is given, but a faster turnover would release cash and cut storage costs.<\/li><li><b>Suggestion:<\/b> better demand forecasting, just-in-time purchasing, promotions for slow items.<\/li><\/ul>"}, {"h": "Leverage: Debt-to-equity 0.36", "b": "<ul class=\"lst\"><li>Debt is only 36 cents for every $1 of owners' funds, so financial risk is LOW.<\/li><li>Interest cover = 100,000 ÷ 5,000 = 20 times, so interest is easily paid.<\/li><li><b>Good:<\/b> room to borrow for growth. <b>Suggestion:<\/b> use cheap debt for expansion if projects are profitable.<\/li><\/ul>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>හැම ratio එකකටම: <b>තේරුම + හොඳ/නරක + ඇයි + යෝජනාව<\/b>. අංක ගණනට එහා ගිය explanation එකයි marks ගන්නේ.<\/div>"}]}, {"id": "3a3", "lab": "3(a) 3", "q": "Question 03", "marks": 5, "title": "Overall assessment", "left": "<p class=\"qtx\"><b>3.<\/b> Assess the company's profitability, liquidity, efficiency, and financial leverage and provide detailed reasoning whether the company is in a strong financial position or if there are areas for concern. <span class=\"mk\">(05 marks)<\/span><\/p><table class=\"tb paper\"><thead><tr><th>Ratio (from part 1)<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Gross Profit Margin<\/td><td>30%<\/td><\/tr><tr class=\"\"><td>Net Profit Margin<\/td><td>15%<\/td><\/tr><tr class=\"\"><td>Current Ratio<\/td><td>3.0 : 1<\/td><\/tr><tr class=\"\"><td>Inventory Turnover<\/td><td>4.67 times (about 78 days)<\/td><\/tr><tr class=\"\"><td>Debt-to-Equity<\/td><td>0.36 (or 0.50 on total liabilities)<\/td><\/tr><\/tbody><\/table>", "steps": [{"h": "Verdict first", "b": "<div class=\"fa\">Kottu Factory is in a STRONG financial position.<\/div><p class=\"sn\">මුලින්ම තීරණය කියන්න. ඊට පස්සේ හේතු.<\/p>"}, {"h": "Reasons (one line for each area)", "b": "<table class=\"tb \"><thead><tr><th>Area<\/th><th>Assessment<\/th><th>Evidence<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Profitability<\/td><td><b>Strong<\/b><\/td><td>GP 30%, net margin 15%<\/td><\/tr><tr class=\"\"><td>Liquidity<\/td><td><b>Very strong<\/b> (maybe excessive)<\/td><td>Current ratio 3.0, quick ratio 2.0<\/td><\/tr><tr class=\"\"><td>Efficiency<\/td><td><b>Moderate<\/b><\/td><td>Inventory turns 4.67 times (about 78 days)<\/td><\/tr><tr class=\"\"><td>Leverage<\/td><td><b>Low risk<\/b><\/td><td>Debt-to-equity 0.36; interest cover 20 times<\/td><\/tr><\/tbody><\/table>"}, {"h": "Areas of concern", "b": "<ul class=\"lst\"><li><b>Idle assets:<\/b> current ratio 3.0 and cash 100,000 may not be earning a return.<\/li><li><b>Inventory:<\/b> turnover could be faster; stock of 75,000 ties up cash.<\/li><li><b>One year only:<\/b> without previous years or industry figures, the trend is unknown.<\/li><\/ul>"}, {"h": "Recommendation", "b": "<ul class=\"lst\"><li>Invest surplus cash in growth; tighten inventory control.<\/li><li>Compare with last year and with competitors before the final judgement.<\/li><\/ul>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>Verdict + areas 4ක් (එක පේළියෙන්) + concerns 2ක් + recommendation. 5 marks නිසා පිටුවක් ලියන්න එපා.<\/div>"}]}, {"id": "4a", "lab": "4(a)", "q": "Question 04", "marks": 20, "title": "Theeraka: ten transactions", "left": "<p class=\"qtx\"><b>a.<\/b> Theeraka recently launched his own logistics company. He has encountered ten different types of transactions but is facing difficulties in accurately recording them due to the absence of a financial accountant. He is seeking your assistance to <b>apply<\/b> these transactions to the <u>Assets = Liabilities + Capital<\/u> equation to ensure proper financial record-keeping. Kindly help Theeraka resolve this matter effectively. <span class=\"mk\">(20 marks)<\/span><\/p><ol class=\"tl\"><li><span>i.<\/span>The owner invests $50,000 in cash to start the business.<\/li><li><span>ii.<\/span>The company buys equipment worth $10,000 in cash.<\/li><li><span>iii.<\/span>The company purchases inventory worth $8,000 on credit.<\/li><li><span>iv.<\/span>The company pays rent of $2,000 for the office in cash.<\/li><li><span>v.<\/span>The company sells inventory worth $6,000 for $9,000 in cash.<\/li><li><span>vi.<\/span>The company pays $5,000 to its suppliers for previously purchased inventory.<\/li><li><span>vii.<\/span>The owner withdraws $3,000 in cash for personal use.<\/li><li><span>viii.<\/span>The company takes a loan of $20,000 from a bank.<\/li><li><span>ix.<\/span>The company pays $4,000 in salaries to its employees in cash.<\/li><li><span>x.<\/span>The company purchases office supplies worth $500 in cash.<\/li><\/ol>", "steps": [{"h": "Method — every transaction, same 3 checks", "b": "<p class=\"sn\">හැම transaction එකකටම කරන්නේ: <b>1)<\/b> බලපාන items මොනවාද? <b>2)<\/b> + ද − ද? <b>3)<\/b> අන්තිමට Assets = Liabilities + Capital tally වෙනවද බලන්න.<\/p><table class=\"tb \"><thead><tr><th>Type of transaction<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>Owner invests / withdraws<\/td><td>Cash ↑ / ↓ &nbsp;and&nbsp; Capital ↑ / ↓<\/td><\/tr><tr class=\"\"><td>Buy asset for cash<\/td><td>Asset ↑, Cash ↓ (swap)<\/td><\/tr><tr class=\"\"><td>Buy on credit<\/td><td>Asset ↑, Payables ↑<\/td><\/tr><tr class=\"\"><td>Expense paid in cash (rent, salaries)<\/td><td>Cash ↓, Capital ↓<\/td><\/tr><tr class=\"\"><td>Sale at a profit<\/td><td>Cash ↑, Inventory ↓ (cost), Capital ↑ (profit)<\/td><\/tr><tr class=\"\"><td>Pay a supplier<\/td><td>Cash ↓, Payables ↓<\/td><\/tr><tr class=\"\"><td>Loan received<\/td><td>Cash ↑, Loan ↑<\/td><\/tr><\/tbody><\/table>"}, {"h": "(i) Owner invests cash", "b": "<div class=\"tx\">The owner invests $50,000 in cash to start the business.<\/div><p class=\"sn\">Cash (asset) ඉහළ යනවා, owner ගේ capital ත් ඒ ප්‍රමාණයෙන්ම ඉහළ යනවා.<\/p><div class=\"ef\"><b>Cash<\/b> +50,000 &nbsp;|&nbsp; <b>Capital<\/b> +50,000<\/div><div class=\"run\">Assets <b>50,000<\/b> = Liabilities <b>0<\/b> + Capital <b>50,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(ii) Buys equipment (cash)", "b": "<div class=\"tx\">The company buys equipment worth $10,000 in cash.<\/div><p class=\"sn\">Asset එකක් තව asset එකකට මාරු වුණා (swap): Equipment ↑, Cash ↓. Total assets වෙනස් වෙන්නේ නෑ.<\/p><div class=\"ef\"><b>Equipment<\/b> +10,000 &nbsp;|&nbsp; <b>Cash<\/b> &minus;10,000<\/div><div class=\"run\">Assets <b>50,000<\/b> = Liabilities <b>0<\/b> + Capital <b>50,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(iii) Buys inventory on credit", "b": "<div class=\"tx\">The company purchases inventory worth $8,000 on credit.<\/div><p class=\"sn\">Inventory (asset) ↑ සහ supplier ට ගෙවන්න තියෙන Payables (liability) ↑ — දෙපැත්තම 8,000.<\/p><div class=\"ef\"><b>Inventory<\/b> +8,000 &nbsp;|&nbsp; <b>Payables<\/b> +8,000<\/div><div class=\"run\">Assets <b>58,000<\/b> = Liabilities <b>8,000<\/b> + Capital <b>50,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(iv) Pays rent (expense)", "b": "<div class=\"tx\">The company pays rent of $2,000 for the office in cash.<\/div><p class=\"sn\">Rent එක expense එකක්: Cash ↓ සහ ලාභය අඩු වෙන නිසා Capital ↓.<\/p><div class=\"ef\"><b>Cash<\/b> &minus;2,000 &nbsp;|&nbsp; <b>Capital<\/b> &minus;2,000<\/div><div class=\"run\">Assets <b>56,000<\/b> = Liabilities <b>8,000<\/b> + Capital <b>48,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(v) Sells inventory at a profit", "b": "<div class=\"tx\">The company sells inventory worth $6,000 for $9,000 in cash.<\/div><p class=\"sn\">Cash +9,000, Inventory −6,000 (cost එක). ලාභය = 9,000 − 6,000 = <b>3,000<\/b> → Capital +3,000.<\/p><div class=\"ef\"><b>Cash<\/b> +9,000 &nbsp;|&nbsp; <b>Inventory<\/b> &minus;6,000 &nbsp;|&nbsp; <b>Capital<\/b> +3,000<\/div><div class=\"run\">Assets <b>59,000<\/b> = Liabilities <b>8,000<\/b> + Capital <b>51,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(vi) Pays suppliers", "b": "<div class=\"tx\">The company pays $5,000 to its suppliers for previously purchased inventory.<\/div><p class=\"sn\">Cash ↓ සහ Payables (liability) ↓ — expense නෙවෙයි, ණය ගෙවීමක්. Capital වෙනස් වෙන්නේ නෑ.<\/p><div class=\"ef\"><b>Cash<\/b> &minus;5,000 &nbsp;|&nbsp; <b>Payables<\/b> &minus;5,000<\/div><div class=\"run\">Assets <b>54,000<\/b> = Liabilities <b>3,000<\/b> + Capital <b>51,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(vii) Owner's drawings", "b": "<div class=\"tx\">The owner withdraws $3,000 in cash for personal use.<\/div><p class=\"sn\">Drawings = owner ගත් මුදල: Cash ↓ සහ Capital ↓ (expense එකක් නෙවෙයි, capital එකෙන් අඩු වෙනවා).<\/p><div class=\"ef\"><b>Cash<\/b> &minus;3,000 &nbsp;|&nbsp; <b>Capital<\/b> &minus;3,000<\/div><div class=\"run\">Assets <b>51,000<\/b> = Liabilities <b>3,000<\/b> + Capital <b>48,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(viii) Bank loan received", "b": "<div class=\"tx\">The company takes a loan of $20,000 from a bank.<\/div><p class=\"sn\">Cash ↑ සහ Bank Loan (liability) ↑ — capital වෙනස් වෙන්නේ නෑ.<\/p><div class=\"ef\"><b>Cash<\/b> +20,000 &nbsp;|&nbsp; <b>Loan<\/b> +20,000<\/div><div class=\"run\">Assets <b>71,000<\/b> = Liabilities <b>23,000<\/b> + Capital <b>48,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(ix) Pays salaries (expense)", "b": "<div class=\"tx\">The company pays $4,000 in salaries to its employees in cash.<\/div><p class=\"sn\">Salaries = expense: Cash ↓ සහ Capital ↓.<\/p><div class=\"ef\"><b>Cash<\/b> &minus;4,000 &nbsp;|&nbsp; <b>Capital<\/b> &minus;4,000<\/div><div class=\"run\">Assets <b>67,000<\/b> = Liabilities <b>23,000<\/b> + Capital <b>44,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "(x) Buys office supplies", "b": "<div class=\"tx\">The company purchases office supplies worth $500 in cash.<\/div><p class=\"sn\">Office supplies (asset) ↑, Cash ↓ — swap. (Expense ලෙස ගත්තොත් Capital −500; assumption එක ලියන්න.)<\/p><div class=\"ef\"><b>Supplies<\/b> +500 &nbsp;|&nbsp; <b>Cash<\/b> &minus;500<\/div><div class=\"run\">Assets <b>67,000<\/b> = Liabilities <b>23,000<\/b> + Capital <b>44,000<\/b> &nbsp;<span class=\"ok\">Tally OK<\/span><\/div>"}, {"h": "Complete table (write this in the answer book)", "b": "<p class=\"sn\">අන්තිමට සියල්ල එක table එකකට දාන්න. මේක තමයි answer sheet එකේ ලියන්නේ.<\/p><div class=\"grpnote\">Assets: Cash, Inventory, Equipment, Supplies &nbsp;|&nbsp; Liabilities: Payables, Loan &nbsp;|&nbsp; Capital<\/div><table class=\"tb num\"><thead><tr><th>#<\/th><th>Cash<\/th><th>Inventory<\/th><th>Equipment<\/th><th>Supplies<\/th><th>Payables<\/th><th>Loan<\/th><th>Capital<\/th><\/tr><\/thead><tbody><tr class=\"\"><td>(i)<\/td><td>+50,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>+50,000<\/td><\/tr><tr class=\"\"><td>(ii)<\/td><td>&minus;10,000<\/td><td><\/td><td>+10,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr class=\"\"><td>(iii)<\/td><td><\/td><td>+8,000<\/td><td><\/td><td><\/td><td>+8,000<\/td><td><\/td><td><\/td><\/tr><tr class=\"\"><td>(iv)<\/td><td>&minus;2,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>&minus;2,000<\/td><\/tr><tr class=\"\"><td>(v)<\/td><td>+9,000<\/td><td>&minus;6,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>+3,000<\/td><\/tr><tr class=\"\"><td>(vi)<\/td><td>&minus;5,000<\/td><td><\/td><td><\/td><td><\/td><td>&minus;5,000<\/td><td><\/td><td><\/td><\/tr><tr class=\"\"><td>(vii)<\/td><td>&minus;3,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>&minus;3,000<\/td><\/tr><tr class=\"\"><td>(viii)<\/td><td>+20,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>+20,000<\/td><td><\/td><\/tr><tr class=\"\"><td>(ix)<\/td><td>&minus;4,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>&minus;4,000<\/td><\/tr><tr class=\"\"><td>(x)<\/td><td>&minus;500<\/td><td><\/td><td><\/td><td>+500<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr class=\"tot\"><td><b>Total<\/b><\/td><td><b>54,500<\/b><\/td><td><b>2,000<\/b><\/td><td><b>10,000<\/b><\/td><td><b>500<\/b><\/td><td><b>3,000<\/b><\/td><td><b>20,000<\/b><\/td><td><b>44,000<\/b><\/td><\/tr><\/tbody><\/table>"}, {"h": "Final answer", "b": "<div class=\"fa\">Assets $67,000 = Liabilities $23,000 + Capital $44,000<\/div><ul class=\"lst\"><li>Assets 67,000 = Cash 54,500 + Inventory 2,000 + Equipment 10,000 + Supplies 500<\/li><li>Liabilities 23,000 = Payables 3,000 + Bank loan 20,000<\/li><li>Capital 44,000 = 50,000 invested + 3,000 profit &minus; 2,000 rent &minus; 3,000 drawings &minus; 4,000 salaries<\/li><\/ul><div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>(v) ලාභය (9,000 − 6,000) අමතක කරන්න එපා. (x) office supplies: asset ලෙස ගත්තා (swap) — expense ලෙස ගත්තොත් Capital 43,500, Assets 66,500 වෙනවා; <b>assumption එක ලියන්න<\/b>.<\/div>"}]}, {"id": "4b", "lab": "4(b)", "q": "Question 04", "marks": 5, "title": "Hire purchase: advantages", "left": "<p class=\"qtx\"><b>b.<\/b> Identify the advantages of hire purchase from the perspective of consumers and businesses.<\/p>", "steps": [{"h": "What is hire purchase?", "b": "<p class=\"sn\">Hire purchase = භාණ්ඩය දැන්ම පාවිච්චි කරන්න ගන්නවා, මිල <b>වාරික වලින්<\/b> ගෙවනවා. අන්තිම වාරිකය ගෙවූ පසු තමයි හිමිකම ලැබෙන්නේ.<\/p>"}, {"h": "Advantages for consumers", "b": "<div class=\"fa\">Consumers<\/div><ul class=\"lst\"><li>Can use the asset immediately without paying the full price.<\/li><li>Payments spread over instalments: easy budgeting, savings kept.<\/li><li>Ownership passes to the buyer after the final instalment.<\/li><li>Usually easier to get than a bank loan.<\/li><\/ul>"}, {"h": "Advantages for businesses", "b": "<div class=\"fa\">Businesses<\/div><ul class=\"lst\"><li>Acquire machinery or vehicles that earn revenue without a large cash outlay (working capital preserved).<\/li><li>Fixed instalments help cash-flow planning.<\/li><li>The asset acts as security, so approval is easier.<\/li><li>Sellers increase sales volume and earn interest income.<\/li><\/ul>"}, {"h": "Exam tip", "b": "<div class=\"tp\"><span class=\"lb\">EXAM TIP<\/span>Consumers 2 + Businesses 2 හෝ 3 ලියන්න; 5 marks. 'Consumers' සහ 'Businesses' heading දෙකක් දාන්න.<\/div>"}]}]}};

let pdfLib=null,pvTok=0;

async function showPdf(file){
  const tok=++pvTok,box=$("#pv");if(!box)return;
  try{
    const pdf=await (await loadPdfJs()).getDocument(file).promise;
    if(tok!==pvTok)return;
    const g=$("#pgn");if(g)g.textContent=pdf.numPages+(pdf.numPages>1?" pages":" page");
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const io=new IntersectionObserver(es=>es.forEach(async e=>{
      if(!e.isIntersecting)return;io.unobserve(e.target);
      const pg=await pdf.getPage(+e.target.dataset.p);if(tok!==pvTok)return;
      const b=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(Math.max(e.target.clientWidth,700),1000)*dpr/b.width});
      const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      if(tok===pvTok)e.target.prepend(cv)}),{rootMargin:"700px 0px"});
    const pages=[];
    for(let i=1;i<=pdf.numPages;i++){const v=(await pdf.getPage(i)).getViewport({scale:1}),d=document.createElement("div");
      d.className="vpage";d.dataset.p=i;d.style.aspectRatio=v.width+" / "+v.height;d.innerHTML=`<i>${i} / ${pdf.numPages}</i>`;pages.push(d)}
    if(tok!==pvTok)return;

  }catch(err){if(tok===pvTok)box.innerHTML=`<div class="vmsg">Preview is not available right now. Use <b>Open in new tab</b> or <b>Download</b> above.</div>`}

  else if(sec==="rules")m.innerHTML=viewRules(M);
  else m.innerHTML=viewLecture(M,+sec.slice(1));
  m.classList.toggle("wide",sec==="map"||sec==="papers");m.classList.remove("fade");void m.offsetWidth;
  wireMain(M);updSide(M);
  if(sec==="papers")showPdf(curDoc.file);else pvTok++;
  if(sec==="message")wireMsg(M);
}
function wireMain(M){
  document.querySelectorAll(".bar").forEach(b=>b.onclick=()=>location.hash=`#${M.key}/${b.dataset.n}`);
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>location.hash=`#${M.key}/${b.dataset.open}`);
  const segs=()=>document.querySelectorAll(".donut .seg");
  segs().forEach(c=>{c.onclick=()=>location.hash=`#${M.key}/${c.dataset.n}`;c.onmouseenter=()=>segs().forEach(x=>x.style.opacity=x===c?1:.25);c.onmouseleave=()=>segs().forEach(x=>x.style.opacity=1)});
  document.querySelectorAll("[data-hi]").forEach(r=>{r.onmouseenter=()=>segs().forEach(c=>c.style.opacity=c.dataset.n===r.dataset.hi?1:.25);r.onmouseleave=()=>segs().forEach(c=>c.style.opacity=1)});
  document.querySelectorAll(".topic").forEach(tp=>{
    tp.querySelector(":scope>.nrow").onclick=e=>{
      if(e.target.closest("[data-ck]")){const on=!tp.classList.contains("done");tp.classList.toggle("done",on);if(on)done[tp.dataset.id]=1;else delete done[tp.dataset.id];store.set("lws_done",done);updSide(M);return}
      const o=!tp.classList.contains("open");tp.classList.toggle("open",o);tp.querySelector(":scope>.nrow").setAttribute("aria-expanded",o)};
  });
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==="ex")document.querySelectorAll(".topic").forEach(t=>t.classList.add("open"));
    if(a==="co")document.querySelectorAll(".topic").forEach(t=>t.classList.remove("open"));
    if(a==="hot"){hotOnly=!hotOnly;b.classList.toggle("on",hotOnly);const L=DATA[mod].lectures.find(l=>l.n===+sec.slice(1));document.querySelectorAll(".topic").forEach((t,i)=>t.classList.toggle("hide",hotOnly&&!L.topics[i].h))}
  });
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.go)location.hash=`#${M.key}/${b.dataset.go}`});
  if(sec.startsWith("l")&&hotOnly){const L=M.lectures.find(l=>l.n===+sec.slice(1));document.querySelectorAll(".topic").forEach((t,i)=>t.classList.toggle("hide",!L.topics[i].h))}
}

/* ------------------------------------------------------------------ try with me */
let tryOn=false,ti=0,ts=0,tryKey="";
const tclamp=(i,n)=>Math.max(0,Math.min(n-1,i));
function buildTry(M,idx,full){
  const T=TRY[M.key],S=T.slides;ti=tclamp(idx,S.length);const sl=S[ti];ts=full?sl.steps.length:0;
  let lastQ="";
  const chips=S.map((x,i)=>{const hd=x.q!==lastQ?`<span class="tchip q">${x.q.replace("Question ","Q")}</span>`:"";lastQ=x.q;return hd+`<button class="tchip ${i===ti?"on":""}" data-i="${i}">${x.lab}</button>`}).join("");
  $("#tw").innerHTML=`
   <div class="tbar"><a class="back" href="#${M.key}/rules">${I.back}Back</a><div class="ttl"><small>Try with me</small>${T.meta.title}</div><div class="tchips" id="tchips">${chips}</div></div>
   <div class="tbody" id="tbody">
     <div class="tpl" id="tpl"><div class="tph"><span class="qn">${sl.q}</span><span class="mkc">${sl.marks} marks</span><h2>${sl.lab}  ${sl.title}</h2></div><div class="paper">${sl.left}</div></div>
     <div class="tpr" id="tpr"><div class="tph"><span class="qn">Answer</span><h2>${sl.title}</h2></div><div id="tst"></div></div>
   </div>
   <div class="tbot"><div class="tprog"><div class="tt" id="ttt"></div><div class="bar2"><i id="tbar"></i></div></div><span class="thelp">Click or press → to reveal · ← to go back · Esc to exit</span>
     <button class="tbtn" id="tprev" type="button">Previous</button><button class="tbtn" id="tall" type="button">Show all</button><button class="tbtn big" id="tnext" type="button">Reveal next</button></div>`;
  $("#tchips").querySelectorAll(".tchip[data-i]").forEach(b=>b.onclick=e=>{e.stopPropagation();buildTry(M,+b.dataset.i,false);tryHash()});
  $("#tprev").onclick=e=>{e.stopPropagation();prevTry(M)};$("#tnext").onclick=e=>{e.stopPropagation();nextTry(M)};
  $("#tall").onclick=e=>{e.stopPropagation();ts=sl.steps.length;updTry(M,false)};
  $("#tpr").onclick=e=>{if(e.target.closest("a,button")||String(window.getSelection()).length)return;nextTry(M)};
  const a=$("#tchips .tchip.on");if(a)a.scrollIntoView({inline:"center",block:"nearest"});
  updTry(M,false);
}
function stepHTML(st,i){return `<div class="st" data-k="${i}"><h5><i>${i+1}</i>${st.h}</h5>${st.b}</div>`}
function updTry(M,anim){
  const sl=TRY[M.key].slides[ti],box=$("#tst"),n=sl.steps.length;
  const cur=box.querySelectorAll(".st").length;
  if(ts>cur){for(let i=cur;i<ts;i++)box.insertAdjacentHTML("beforeend",stepHTML(sl.steps[i],i));
    if(anim){const last=box.lastElementChild,pr=$("#tpr");pr.scrollTo({top:Math.max(0,last.offsetTop-90),behavior:"smooth"})}}
  else if(ts<cur){for(let i=cur;i>ts;i--)box.lastElementChild.remove()}
  box.querySelectorAll(".st").forEach((e,i)=>e.style.animation=anim&&i===ts-1?"":"none");
  box.querySelectorAll(".thint,.tend").forEach(e=>e.remove());
  if(ts===0)box.insertAdjacentHTML("beforeend",`<div class="thint"><b>Try it yourself first.</b><br>Click anywhere here, or press the right arrow, to reveal the first step.</div>`);
  if(ts===n)box.insertAdjacentHTML("beforeend",`<div class="tend">End of ${sl.lab}. ${ti<TRY[M.key].slides.length-1?"Click for the next question.":"That was the whole paper. Well done!"}</div>`);
  const S=TRY[M.key].slides,done=S.slice(0,ti).reduce((a,x)=>a+x.steps.length,0)+ts,tot=S.reduce((a,x)=>a+x.steps.length,0);
  $("#ttt").innerHTML=`<b>${sl.lab}</b> · slide ${ti+1} of ${S.length} · step ${ts} of ${n}`;
  $("#tbar").style.width=(done/tot*100)+"%";
  $("#tnext").textContent=ts<n?"Reveal next":ti<S.length-1?"Next question":"Finished";
  $("#tprev").disabled=ti===0&&ts===0;
}
function tryHash(){history.replaceState(null,"",`#${mod||"bmit"}/try/${ti+1}`)}
function nextTry(M){
  const S=TRY[M.key].slides,n=S[ti].steps.length;
  if(ts<n){ts++;updTry(M,true)}
  else if(ti<S.length-1){buildTry(M,ti+1,false);tryHash();$("#tpl").scrollTop=0}
}
function prevTry(M){
  if(ts>0){ts--;updTry(M,false)}
  else if(ti>0){buildTry(M,ti-1,true);tryHash()}
}
document.addEventListener("keydown",e=>{
  if(!tryOn||e.ctrlKey||e.metaKey||e.altKey)return;
  const M=DATA[tryKey];if(!M)return;
  if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();nextTry(M)}
  else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(e.key)){e.preventDefault();prevTry(M)}
  else if(e.key==="Escape"){location.hash=`#${tryKey}/rules`}
});

/* ------------------------------------------------------------------ router */
function show(id){["#v-land","#v-mod","#v-try"].forEach(s=>$(s).classList.remove("on"));const e=$(id);void e.offsetWidth;e.classList.add("on");window.scrollTo(0,0)}
function route(){
  const h=location.hash.replace("#","").split("/");
  tryOn=false;
  if(DATA[h[0]]&&h[1]==="try"&&TRY[h[0]]){
    const M=DATA[h[0]];tryKey=M.key;tryOn=true;mod=null;
    show("#v-try");buildTry(M,(parseInt(h[2],10)||1)-1,false);
  }else if(DATA[h[0]]){
    const M=DATA[h[0]];
    const ns=!h[1]||h[1]==="map"?"map":h[1]==="rules"?"rules":h[1]==="papers"?"papers":h[1]==="message"&&MSG[M.key]?"message":(M.lectures.some(l=>l.n===+h[1])?"l"+(+h[1]):"map");
    if(mod!==M.key){mod=M.key;hotOnly=false;renderSide(M)}
    sec=ns;pdoc=ns==="papers"?(h[2]||""):"";if(!$("#v-mod").classList.contains("on"))show("#v-mod");else window.scrollTo(0,0);
    renderMain();
    if(h[2]==="all")document.querySelectorAll(".topic").forEach(t=>t.classList.add("open"));
  }else{mod=null;renderLanding();show("#v-land")}
}
